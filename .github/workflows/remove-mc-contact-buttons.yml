name: Remove MeshCore contact buttons

on:
  push:
    branches:
      - fix/mc-dm-number-use-operational-prefix

permissions:
  contents: write

jobs:
  apply-and-validate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: fix/mc-dm-number-use-operational-prefix
          fetch-depth: 0

      - name: Remove only /mc_contactos buttons
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('source/Telegram_Bot_Broker.py')
          s = p.read_text(encoding='utf-8')

          s = s.replace(
              '        "Pulsa <b>DM</b> o usa <code>/dm_mc N texto</code> con el número de la lista.",\n',
              '        "Usa <code>/dm_mc N texto</code> con el número de la lista.",\n',
              1,
          )
          s = s.replace('    keyboard = []\n\n', '', 1)

          old_button = '''        keyboard.append([\n            InlineKeyboardButton(\n                f"✉️ DM {idx:02d} · {name[:24] or display_prefix[:8] or dm_key[:8]}",\n                callback_data=f"mc_dm:{idx}:{dm_key[:32]}",\n            )\n        ])\n'''
          if s.count(old_button) != 1:
              raise SystemExit(f'expected button block once, found {s.count(old_button)}')
          s = s.replace(old_button, '', 1)

          s = s.replace(
              '        reply_markup=InlineKeyboardMarkup(keyboard[:40]) if keyboard else None,\n',
              '',
              1,
          )
          p.write_text(s, encoding='utf-8')
          PY

      - name: Update regression expectations
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('tests/test_mc_contactos_full_public_key.py')
          s = p.read_text(encoding='utf-8')
          s = s.replace(
              '    assert \'callback_data=f"mc_dm:{idx}:{dm_key[:32]}"\' in fn\n',
              '    assert \'callback_data=f"mc_dm:{idx}:{dm_key[:32]}"\' not in fn\n'
              '    assert \'keyboard.append([\' not in fn\n'
              '    assert \'reply_markup=InlineKeyboardMarkup\' not in fn\n',
              1,
          )
          p.write_text(s, encoding='utf-8')
          PY

      - name: Validate
        shell: bash
        run: |
          python -m py_compile source/Telegram_Bot_Broker.py
          python - <<'PY'
          import importlib.util
          for fn in ['tests/test_mc_contactos_full_public_key.py', 'tests/test_mc_dm_alias_confirmation.py']:
              spec = importlib.util.spec_from_file_location('reg', fn)
              mod = importlib.util.module_from_spec(spec)
              spec.loader.exec_module(mod)
              for name in dir(mod):
                  if name.startswith('test_'):
                      getattr(mod, name)()
          PY
          git diff --check
          grep -n 'mc_map\[str(idx)\] = dm_key' source/Telegram_Bot_Broker.py
          ! grep -n 'callback_data=f"mc_dm:' source/Telegram_Bot_Broker.py | grep -A5 -B5 'mc_contactos' || true

      - name: Commit validated UI cleanup and remove workflow
        shell: bash
        run: |
          rm .github/workflows/remove-mc-contact-buttons.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add source/Telegram_Bot_Broker.py tests/test_mc_contactos_full_public_key.py .github/workflows/remove-mc-contact-buttons.yml
          git commit -m "ui: remove MeshCore DM buttons from contact list"
          git push origin HEAD:fix/mc-dm-number-use-operational-prefix
