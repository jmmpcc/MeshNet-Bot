name: Apply mc_contactos alias-only presentation

on:
  push:
    branches:
      - fix/mc-contactos-full-public-key

permissions:
  contents: write

jobs:
  apply-fix:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: fix/mc-contactos-full-public-key
          fetch-depth: 0

      - name: Apply alias-only presentation
        shell: bash
        run: |
          echo '' | base64 -d > /tmp/apply_alias_only.py
          python /tmp/apply_alias_only.py
          echo '' | base64 -d > tests/test_mc_contactos_full_public_key.py

      - name: Validate syntax and regression test
        shell: bash
        run: |
          python -m py_compile source/Telegram_Bot_Broker.py
          python - <<'PY'
          import importlib.util
          from pathlib import Path
          path = Path('tests/test_mc_contactos_full_public_key.py')
          spec = importlib.util.spec_from_file_location('mc_contactos_test', path)
          module = importlib.util.module_from_spec(spec)
          assert spec.loader is not None
          spec.loader.exec_module(module)
          module.test_mc_contactos_muestra_solo_numero_y_alias_y_conserva_dm_key()
          module.test_telegram_bot_broker_sigue_siendo_python_valido()
          print('mc_contactos alias-only regression: OK')
          PY
          git diff --check

      - name: Remove temporary workflow and commit fix
        shell: bash
        run: |
          rm -f .github/workflows/apply-mc-contactos-alias-only.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "fix: show only aliases in MeshCore contacts"
          git push origin HEAD:fix/mc-contactos-full-public-key
