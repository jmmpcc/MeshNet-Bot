name: Apply mc_contactos alias-only presentation

on:
  push:
    branches:
      - fix/mc-contactos-full-public-key

permissions:
  contents: write

jobs:
  apply-fix:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: fix/mc-contactos-full-public-key
          fetch-depth: 0

      - name: Apply alias-only presentation
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('source/Telegram_Bot_Broker.py')
          src = path.read_text(encoding='utf-8')

          old = '''        # ID canónico del contacto: MeshCore identifica cada nodo por su public_key Ed25519 completa.
        # El dm_key se mantiene separado e intacto porque send_msg resuelve el destino por prefijo.
        canonical_id = public_key or display_prefix or contact_id or dm_key
        name = (c.get("name") or "Sin nombre").strip()
        ls = c.get("last_seen")
        mc_map[str(idx)] = dm_key

        meta = []
        if contact_id and contact_id != display_prefix and contact_id != dm_key:
            meta.append(f"id: {contact_id}")
        # Mostramos la identidad MeshCore completa y, por separado, el prefijo usado para DM.
        # Esto corrige únicamente la presentación; mc_map, botones y /dm_mc siguen usando dm_key.
        last_seen_txt = _format_meshcore_last_seen(ls)
        if last_seen_txt:
            meta.append(f"visto: {last_seen_txt}")
        meta_txt = f" · {' · '.join(meta)}" if meta else ""
        lines.append(
            f"<b>{idx:02d}.</b> 📡 <b>{escape(name)}</b>\n"
            f"    ID: <code>[MC:{escape(canonical_id)}]</code>\n"
            f"    DM: <code>{escape(dm_key)}</code>{escape(meta_txt)}"
        )
'''

          new = '''        # La lista pública muestra únicamente número y alias.
        # El identificador MeshCore permanece interno: el número se resuelve mediante mc_map
        # y /dm_mc N texto continúa enviando al mismo dm_key sin exponer claves al usuario.
        name = (c.get("name") or "Sin nombre").strip()
        mc_map[str(idx)] = dm_key

        lines.append(f"<b>{idx:02d}.</b> 📡 <b>{escape(name)}</b>")
'''

          if src.count(old) != 1:
              raise SystemExit(f'Unexpected target block count: {src.count(old)}')
          src = src.replace(old, new, 1)
          path.write_text(src, encoding='utf-8')

          test_path = Path('tests/test_mc_contactos_full_public_key.py')
          test_path.write_text('''from __future__ import annotations\n\nimport ast\nfrom pathlib import Path\n\n\ndef _mc_contactos_source() -> str:\n    source_path = Path(__file__).resolve().parents[1] / "source" / "Telegram_Bot_Broker.py"\n    source = source_path.read_text(encoding="utf-8")\n    tree = ast.parse(source)\n    for node in tree.body:\n        if isinstance(node, ast.AsyncFunctionDef) and node.name == "mc_contactos_cmd":\n            segment = ast.get_source_segment(source, node)\n            assert segment is not None\n            return segment\n    raise AssertionError("mc_contactos_cmd no encontrada")\n\n\ndef test_mc_contactos_muestra_solo_numero_y_alias_y_conserva_dm_key() -> None:\n    \"\"\"La UI no expone IDs y la selección numérica conserva la resolución DM existente.\"\"\"\n    fn = _mc_contactos_source()\n\n    assert 'lines.append(f"<b>{idx:02d}.</b> 📡 <b>{escape(name)}</b>")' in fn\n    assert 'ID: <code>[MC:' not in fn\n    assert 'DM: <code>' not in fn\n    assert 'meta.append(f"id:' not in fn\n\n    # Regresión: /dm_mc N y los botones siguen resolviendo internamente por dm_key.\n    assert 'mc_map[str(idx)] = dm_key' in fn\n    assert 'callback_data=f"mc_dm:{idx}:{dm_key[:32]}"' in fn\n\n\ndef test_telegram_bot_broker_sigue_siendo_python_valido() -> None:\n    source_path = Path(__file__).resolve().parents[1] / "source" / "Telegram_Bot_Broker.py"\n    ast.parse(source_path.read_text(encoding="utf-8"))\n''', encoding='utf-8')
          PY

      - name: Validate syntax and regression test
        shell: bash
        run: |
          python -m py_compile source/Telegram_Bot_Broker.py
          python - <<'PY'
          import importlib.util
          from pathlib import Path

          path = Path('tests/test_mc_contactos_full_public_key.py')
          spec = importlib.util.spec_from_file_location('mc_contactos_test', path)
          module = importlib.util.module_from_spec(spec)
          assert spec.loader is not None
          spec.loader.exec_module(module)
          module.test_mc_contactos_muestra_solo_numero_y_alias_y_conserva_dm_key()
          module.test_telegram_bot_broker_sigue_siendo_python_valido()
          print('mc_contactos alias-only regression: OK')
          PY
          git diff --check

      - name: Remove temporary workflow and commit fix
        shell: bash
        run: |
          rm -f .github/workflows/apply-mc-contactos-alias-only.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "fix: show only aliases in MeshCore contacts"
          git push origin HEAD:fix/mc-contactos-full-public-key
