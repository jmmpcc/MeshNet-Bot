name: Apply observed MeshCore DM prefix v2

on:
  push:
    branches:
      - fix/mc-observed-dm-prefix

permissions:
  contents: write

jobs:
  apply-and-validate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/mc-observed-dm-prefix
          fetch-depth: 0

      - name: Apply minimal fix
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('source/Meshtastic_Broker.py')
          s=p.read_text(encoding='utf-8')
          old='''    def _meshcore_contact_prefix_by_name(self, name: str) -> str:\n        wanted = _norm_text(name or "").casefold()\n        if not wanted:\n            return ""\n        matches = []\n        for key, alias in (self.contact_aliases or {}).items():\n            if _norm_text(alias).casefold() == wanted and str(key).strip():\n                matches.append(str(key).strip())\n        for contact in (self._mc_contacts_cache or {}).values():\n            if not isinstance(contact, dict):\n                continue\n            contact_name = _norm_text(contact.get("name") or contact.get("adv_name") or contact.get("alias") or contact.get("label") or "")\n            if contact_name.casefold() != wanted:\n                continue\n            public_key = str(contact.get("public_key") or contact.get("pubkey") or contact.get("key") or "").strip()\n            prefix = str(contact.get("pubkey_prefix") or contact.get("key_prefix") or contact.get("prefix") or "").strip()\n            dm_key = prefix or (public_key[:12] if public_key else "")\n            if dm_key:\n                matches.append(dm_key)\n        unique = list(dict.fromkeys(matches))\n        return unique[0] if len(unique) == 1 else ""\n'''
          new='''    def _meshcore_contact_prefix_by_name(self, name: str) -> str:\n        """Resuelve de forma inequívoca el prefijo DM conocido para un alias.\n\n        Prioriza los prefijos reales/configurados de ``contact_aliases``. Solo\n        si no existe esa asociación reutiliza los contactos cacheados y deja\n        ``public_key[:12]`` como compatibilidad legacy.\n        """\n        wanted = _norm_text(name or "").casefold()\n        if not wanted:\n            return ""\n\n        alias_matches = []\n        for key, alias in (self.contact_aliases or {}).items():\n            if _norm_text(alias).casefold() == wanted and str(key).strip():\n                alias_matches.append(str(key).strip())\n        alias_unique = list(dict.fromkeys(alias_matches))\n        if len(alias_unique) == 1:\n            return alias_unique[0]\n        if len(alias_unique) > 1:\n            return ""\n\n        matches = []\n        for contact in (self._mc_contacts_cache or {}).values():\n            if not isinstance(contact, dict):\n                continue\n            contact_name = _norm_text(contact.get("name") or contact.get("adv_name") or contact.get("alias") or contact.get("label") or "")\n            if contact_name.casefold() != wanted:\n                continue\n            public_key = str(contact.get("public_key") or contact.get("pubkey") or contact.get("key") or "").strip()\n            prefix = str(contact.get("pubkey_prefix") or contact.get("key_prefix") or contact.get("prefix") or "").strip()\n            dm_key = prefix or (public_key[:12] if public_key else "")\n            if dm_key:\n                matches.append(dm_key)\n        unique = list(dict.fromkeys(matches))\n        return unique[0] if len(unique) == 1 else ""\n'''
          if s.count(old)!=1: raise SystemExit(f'helper count={s.count(old)}')
          s=s.replace(old,new,1)
          old_rx='''                except Exception:\n                    pass\n\n                # === [BBS] Comandos recibidos directamente por MeshCore ======\n'''
          new_rx='''                except Exception:\n                    pass\n\n                # Conserva en memoria el prefijo DM observado realmente por RF\n                # junto a su alias. No reemplaza configuraciones explícitas.\n                if pref and alias and pref not in self.contact_aliases:\n                    self.contact_aliases[pref] = alias\n\n                # === [BBS] Comandos recibidos directamente por MeshCore ======\n'''
          # Este bloque debe corresponder al punto inmediatamente posterior al unwrap.
          pos=s.find('from bbs_transport import unwrap_meshcore_sender_prefix')
          if pos<0: raise SystemExit('unwrap block missing')
          idx=s.find(old_rx,pos)
          if idx<0: raise SystemExit('rx insertion point missing')
          s=s[:idx]+s[idx:].replace(old_rx,new_rx,1)
          old_dm='''                # send_msg resuelve contactos por prefijo de public_key mediante\n                # get_contact_by_key_prefix(); no mostramos la clave completa como DM.\n                dm_key = display_id or (public_key[:12] if public_key else "") or contact_id\n                display_id = display_id or dm_key or contact_id\n'''
          new_dm='''                # Para DM, el prefix explícito u observado por RF es autoritativo.\n                # public_key[:12] se conserva solo como fallback legacy.\n                observed_prefix = self._meshcore_contact_prefix_by_name(name)\n                dm_key = display_id or observed_prefix or (public_key[:12] if public_key else "") or contact_id\n                display_id = display_id or dm_key or contact_id\n'''
          if s.count(old_dm)!=1: raise SystemExit(f'dm count={s.count(old_dm)}')
          s=s.replace(old_dm,new_dm,1)
          p.write_text(s,encoding='utf-8')
          PY

      - name: Regression
        shell: bash
        run: |
          python -m py_compile source/Meshtastic_Broker.py source/Telegram_Bot_Broker.py
          python - <<'PY'
          import ast
          from pathlib import Path
          s=Path('source/Meshtastic_Broker.py').read_text(encoding='utf-8')
          ast.parse(s)
          assert 'if pref and alias and pref not in self.contact_aliases:' in s
          assert 'self.contact_aliases[pref] = alias' in s
          assert 'observed_prefix = self._meshcore_contact_prefix_by_name(name)' in s
          assert 'dm_key = display_id or observed_prefix or (public_key[:12] if public_key else "") or contact_id' in s
          tree=ast.parse(s)
          fn=next(n for n in ast.walk(tree) if isinstance(n,ast.FunctionDef) and n.name=='_meshcore_contact_prefix_by_name')
          body=ast.get_source_segment(s,fn)
          assert 'alias_unique = list(dict.fromkeys(alias_matches))' in body
          assert 'return alias_unique[0]' in body
          assert 'dm_key = prefix or (public_key[:12] if public_key else "")' in body
          PY
          git diff --check

      - name: Commit validated change
        shell: bash
        run: |
          rm -f .github/workflows/apply-mc-observed-dm-prefix.yml .github/workflows/apply-mc-observed-dm-prefix-v2.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add source/Meshtastic_Broker.py .github/workflows/apply-mc-observed-dm-prefix.yml .github/workflows/apply-mc-observed-dm-prefix-v2.yml
          git commit -m "fix: map contact numbers to observed MeshCore DM prefix"
          git push origin HEAD:fix/mc-observed-dm-prefix
