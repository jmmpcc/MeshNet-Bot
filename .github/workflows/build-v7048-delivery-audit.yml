name: Validate v7.0.48 delivery audit

on:
  push:
    branches:
      - agent/v7.0.48-delivery-audit
    paths:
      - .github/workflows/build-v7048-delivery-audit.yml
      - scripts/integrate_v7048_temp.py
      - scripts/integrate_v7048_fix_temp.py

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/v7.0.48-delivery-audit
          fetch-depth: 0

      - name: Apply v7.0.48
        run: |
          python3 scripts/integrate_v7048_temp.py
          python3 scripts/integrate_v7048_fix_temp.py

      - name: Compile modified Python
        run: |
          python3 -m py_compile \
            shared/delivery_audit.py \
            tools/emergencias_guardia/emergencias/emergency_dispatcher.py \
            tools/emergencias_guardia/emergencias/notifier.py \
            tools/farmacias_guardia/farmacias_guardia.py \
            tools/ControlPanel/web_admin.py

      - name: Install test dependencies
        run: |
          python3 -m pip install -q pytest fastapi pydantic httpx

      - name: Run focused and regression tests
        run: |
          python3 -m pytest \
            tests/test_delivery_audit_v7048.py \
            tests/test_emergency_dispatcher.py \
            tests/test_emergency_sources_v7043.py \
            tests/test_emergency_province_resolution_v7045.py \
            tools/farmacias_guardia/tests/test_farmacias_guardia.py \
            tools/ControlPanel/tests/test_web_admin.py -v
          python3 -m pytest \
            tests/test_aprsis_url_integrity_v7046.py \
            tests/test_aprsis_long_bulletin_v7047.py -v

      - name: Diff validation
        run: |
          git diff --check
          git status --short

      - name: Commit validated phase
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            shared/delivery_audit.py \
            tools/emergencias_guardia/emergencias/emergency_dispatcher.py \
            tools/emergencias_guardia/emergencias/notifier.py \
            tools/farmacias_guardia/farmacias_guardia.py \
            tools/ControlPanel/web_admin.py \
            tools/ControlPanel/README.md \
            tests/test_delivery_audit_v7048.py \
            .env_example README.md \
            docs/CHANGELOG_v7.0.48.md docs/Historial_Versiones.md
          if git diff --cached --quiet; then
            echo 'No functional changes to commit'
            exit 0
          fi
          git commit -m 'v7.0.48: add common delivery audit dashboard'
          git push origin HEAD:agent/v7.0.48-delivery-audit
