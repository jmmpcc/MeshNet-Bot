name: Fix MeshCore numeric DM operational prefix

on:
  push:
    branches:
      - fix/mc-dm-number-use-operational-prefix

permissions:
  contents: write

jobs:
  apply-and-validate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: fix/mc-dm-number-use-operational-prefix
          fetch-depth: 0

      - name: Restore operational dm_key mapping
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('source/Telegram_Bot_Broker.py')
          s = p.read_text(encoding='utf-8')
          old = '''        # La lista pública muestra únicamente número y alias.\n        # La referencia autoritativa interna es la public_key completa cuando el\n        # broker la proporciona. El dm_key corto se conserva solo como fallback\n        # compatible para contactos legacy que no expongan public_key.\n        name = (c.get("name") or "Sin nombre").strip()\n        routing_key = public_key or dm_key\n        mc_map[str(idx)] = routing_key\n        mc_alias_map[str(idx)] = name\n'''
          new = '''        # La lista pública muestra únicamente número y alias.\n        # El número se asocia al dm_key/prefijo operativo que ya utiliza la ruta\n        # MeshCore validada en producción. La public_key completa se mantiene en\n        # los datos del contacto, pero no sustituye al destino aceptado por send_msg.\n        name = (c.get("name") or "Sin nombre").strip()\n        mc_map[str(idx)] = dm_key\n        mc_alias_map[str(idx)] = name\n'''
          if s.count(old) != 1:
              raise SystemExit(f'expected mapping block once, found {s.count(old)}')
          p.write_text(s.replace(old, new, 1), encoding='utf-8')
          PY

      - name: Update regressions
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('tests/test_mc_contactos_full_public_key.py')
          s = p.read_text(encoding='utf-8')
          old = '''    # Regresión: /dm_mc N usa la public_key completa cuando está disponible.\n    # El callback corto se conserva solo como fallback compatible con el límite\n    # de callback_data de Telegram; el mapa interno es la ruta autoritativa.\n    assert 'routing_key = public_key or dm_key' in fn\n    assert 'mc_map[str(idx)] = routing_key' in fn\n    assert 'callback_data=f"mc_dm:{idx}:{dm_key[:32]}"' in fn\n'''
          new = '''    # Regresión: /dm_mc N conserva el dm_key/prefijo operativo que la ruta\n    # MeshCore ya acepta y que coincide con el prefix observado en RX real.\n    assert 'mc_map[str(idx)] = dm_key' in fn\n    assert 'routing_key = public_key or dm_key' not in fn\n    assert 'callback_data=f"mc_dm:{idx}:{dm_key[:32]}"' in fn\n'''
          if s.count(old) != 1:
              raise SystemExit(f'expected contact regression block once, found {s.count(old)}')
          p.write_text(s.replace(old, new, 1), encoding='utf-8')

          p2 = Path('tests/test_mc_dm_alias_confirmation.py')
          s2 = p2.read_text(encoding='utf-8')
          s2 = s2.replace('    assert \'routing_key = public_key or dm_key\' in source\n    assert \'mc_map[str(idx)] = routing_key\' in source\n', '    assert \'mc_map[str(idx)] = dm_key\' in source\n    assert \'routing_key = public_key or dm_key\' not in source\n', 1)
          p2.write_text(s2, encoding='utf-8')
          PY

      - name: Validate
        shell: bash
        run: |
          python -m py_compile source/Telegram_Bot_Broker.py
          python - <<'PY'
          import importlib.util
          for fn in ['tests/test_mc_contactos_full_public_key.py', 'tests/test_mc_dm_alias_confirmation.py']:
              spec = importlib.util.spec_from_file_location('reg', fn)
              mod = importlib.util.module_from_spec(spec)
              spec.loader.exec_module(mod)
              for name in dir(mod):
                  if name.startswith('test_'):
                      getattr(mod, name)()
          PY
          git diff --check
          grep -n 'mc_map\[str(idx)\] = dm_key' source/Telegram_Bot_Broker.py
          ! grep -n 'routing_key = public_key or dm_key' source/Telegram_Bot_Broker.py

      - name: Commit validated fix and remove workflow
        shell: bash
        run: |
          rm .github/workflows/fix-mc-dm-number-prefix.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add source/Telegram_Bot_Broker.py tests/test_mc_contactos_full_public_key.py tests/test_mc_dm_alias_confirmation.py .github/workflows/fix-mc-dm-number-prefix.yml
          git commit -m "fix: restore operational MeshCore DM prefix behind contact numbers"
          git push origin HEAD:fix/mc-dm-number-use-operational-prefix
