name: Validate public emergency map

on:
  push:
    branches:
      - agent/public-emergency-map
    paths:
      - .github/workflows/validate-public-emergency-map.yml
      - tools/emergencias_guardia/emergencias/public_map.py
      - tools/emergencias_guardia/tests/test_public_map.py
      - tools/ControlPanel/public_emergency_map_link.py
      - tools/ControlPanel/control_panel.py
  pull_request:
    paths:
      - .github/workflows/validate-public-emergency-map.yml
      - tools/emergencias_guardia/emergencias/public_map.py
      - tools/emergencias_guardia/tests/test_public_map.py
      - tools/ControlPanel/public_emergency_map_link.py
      - tools/ControlPanel/control_panel.py

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Compile changed Python modules
        run: |
          python3 -m py_compile \
            tools/emergencias_guardia/emergencias/public_map.py \
            tools/ControlPanel/public_emergency_map_link.py \
            tools/ControlPanel/control_panel.py

      - name: Public map regression tests
        run: python3 -m unittest tools.emergencias_guardia.tests.test_public_map -v

      - name: Diff whitespace validation
        run: git diff --check HEAD^ HEAD
