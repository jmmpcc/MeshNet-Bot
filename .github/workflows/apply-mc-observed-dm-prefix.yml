name: Apply observed MeshCore DM prefix

on:
  push:
    branches:
      - fix/mc-observed-dm-prefix

permissions:
  contents: write

jobs:
  apply-and-validate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: fix/mc-observed-dm-prefix
          fetch-depth: 0

      - name: Apply minimal broker fix
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('source/Meshtastic_Broker.py')
          s = p.read_text(encoding='utf-8')

          old_helper = '''    def _meshcore_contact_prefix_by_name(self, name: str) -> str:\n        wanted = _norm_text(name or "").casefold()\n        if not wanted:\n            return ""\n        matches = []\n        for key, alias in (self.contact_aliases or {}).items():\n            if _norm_text(alias).casefold() == wanted and str(key).strip():\n                matches.append(str(key).strip())\n        for contact in (self._mc_contacts_cache or {}).values():\n            if not isinstance(contact, dict):\n                continue\n            contact_name = _norm_text(contact.get("name") or contact.get("adv_name") or contact.get("alias") or contact.get("label") or "")\n            if contact_name.casefold() != wanted:\n                continue\n            public_key = str(contact.get("public_key") or contact.get("pubkey") or contact.get("key") or "").strip()\n            prefix = str(contact.get("pubkey_prefix") or contact.get("key_prefix") or contact.get("prefix") or "").strip()\n            dm_key = prefix or (public_key[:12] if public_key else "")\n            if dm_key:\n                matches.append(dm_key)\n        unique = list(dict.fromkeys(matches))\n        return unique[0] if len(unique) == 1 else ""\n'''

          new_helper = '''    def _meshcore_contact_prefix_by_name(self, name: str) -> str:\n        """Resuelve el prefijo DM real de un contacto MeshCore por su alias.\n\n        Se llama desde la normalización de contactos y desde los RX donde falta\n        ``pubkey_prefix``. Primero reutiliza ``contact_aliases`` porque contiene\n        tanto los aliases configurados como los prefijos observados realmente por\n        RF. Solo si no existe una asociación inequívoca consulta la caché de\n        contactos y, como último recurso legacy, deriva ``public_key[:12]``.\n\n        Parámetros:\n            name: alias/nombre anunciado por el contacto MeshCore.\n\n        Devuelve:\n            Prefijo DM inequívoco o cadena vacía cuando no puede resolverse con\n            seguridad. Nunca elige entre dos prefijos distintos para el mismo alias.\n        """\n        wanted = _norm_text(name or "").casefold()\n        if not wanted:\n            return ""\n\n        alias_matches = []\n        for key, alias in (self.contact_aliases or {}).items():\n            if _norm_text(alias).casefold() == wanted and str(key).strip():\n                alias_matches.append(str(key).strip())\n        alias_unique = list(dict.fromkeys(alias_matches))\n        if len(alias_unique) == 1:\n            return alias_unique[0]\n        if len(alias_unique) > 1:\n            return ""\n\n        matches = []\n        for contact in (self._mc_contacts_cache or {}).values():\n            if not isinstance(contact, dict):\n                continue\n            contact_name = _norm_text(contact.get("name") or contact.get("adv_name") or contact.get("alias") or contact.get("label") or "")\n            if contact_name.casefold() != wanted:\n                continue\n            public_key = str(contact.get("public_key") or contact.get("pubkey") or contact.get("key") or "").strip()\n            prefix = str(contact.get("pubkey_prefix") or contact.get("key_prefix") or contact.get("prefix") or "").strip()\n            dm_key = prefix or (public_key[:12] if public_key else "")\n            if dm_key:\n                matches.append(dm_key)\n        unique = list(dict.fromkeys(matches))\n        return unique[0] if len(unique) == 1 else ""\n'''

          if s.count(old_helper) != 1:
              raise SystemExit(f'helper block count={s.count(old_helper)}')
          s = s.replace(old_helper, new_helper, 1)

          old_rx = '''                try:\n                    from bbs_transport import unwrap_meshcore_sender_prefix\n\n                    extracted, rest = unwrap_meshcore_sender_prefix(text_msg)\n                    if extracted:\n                        if not alias:\n                            alias = extracted\n                        if not pref:\n                            pref = self._meshcore_contact_prefix_by_name(extracted)\n                        text_msg = rest\n                except Exception:\n                    pass\n\n                # === [BBS] Comandos recibidos directamente por MeshCore ======\n'''

          new_rx = '''                try:\n                    from bbs_transport import unwrap_meshcore_sender_prefix\n\n                    extracted, rest = unwrap_meshcore_sender_prefix(text_msg)\n                    if extracted:\n                        if not alias:\n                            alias = extracted\n                        if not pref:\n                            pref = self._meshcore_contact_prefix_by_name(extracted)\n                        text_msg = rest\n                except Exception:\n                    pass\n\n                # Aprende únicamente en memoria el prefijo DM observado realmente\n                # por RF. Reutilizamos el mapa prefix->alias ya existente y no\n                # sobrescribimos una asociación configurada explícitamente.\n                if pref and alias and pref not in self.contact_aliases:\n                    self.contact_aliases[pref] = alias\n\n                # === [BBS] Comandos recibidos directamente por MeshCore ======\n'''

          if s.count(old_rx) != 1:
              raise SystemExit(f'rx block count={s.count(old_rx)}')
          s = s.replace(old_rx, new_rx, 1)

          old_dm = '''                # send_msg resuelve contactos por prefijo de public_key mediante\n                # get_contact_by_key_prefix(); no mostramos la clave completa como DM.\n                dm_key = display_id or (public_key[:12] if public_key else "") or contact_id\n                display_id = display_id or dm_key or contact_id\n'''
          new_dm = '''                # Para DM se prioriza el prefijo explícito u observado por RF.\n                # ``public_key[:12]`` queda únicamente como fallback legacy porque\n                # no siempre coincide con el prefijo de destino que usa el firmware.\n                observed_prefix = self._meshcore_contact_prefix_by_name(name)\n                dm_key = display_id or observed_prefix or (public_key[:12] if public_key else "") or contact_id\n                display_id = display_id or dm_key or contact_id\n'''
          if s.count(old_dm) != 1:
              raise SystemExit(f'dm block count={s.count(old_dm)}')
          s = s.replace(old_dm, new_dm, 1)

          p.write_text(s, encoding='utf-8')
          PY

      - name: Add regression tests
        shell: bash
        run: |
          cat > tests/test_mc_observed_dm_prefix.py <<'PY'
          import ast
          from pathlib import Path

          SOURCE = Path('source/Meshtastic_Broker.py')

          def test_source_compiles_and_prefers_observed_prefix():
              source = SOURCE.read_text(encoding='utf-8')
              ast.parse(source)
              assert 'observed_prefix = self._meshcore_contact_prefix_by_name(name)' in source
              assert 'dm_key = display_id or observed_prefix or (public_key[:12] if public_key else "") or contact_id' in source

          def test_rx_learns_real_prefix_without_overwriting_config():
              source = SOURCE.read_text(encoding='utf-8')
              assert 'if pref and alias and pref not in self.contact_aliases:' in source
              assert 'self.contact_aliases[pref] = alias' in source

          def test_name_resolver_prioritizes_alias_map_before_public_key_fallback():
              source = SOURCE.read_text(encoding='utf-8')
              tree = ast.parse(source)
              fn = None
              for node in ast.walk(tree):
                  if isinstance(node, (ast.FunctionDef, ast.AsyncFunctionDef)) and node.name == '_meshcore_contact_prefix_by_name':
                      fn = ast.get_source_segment(source, node)
                      break
              assert fn is not None
              assert 'alias_unique = list(dict.fromkeys(alias_matches))' in fn
              assert 'if len(alias_unique) == 1:' in fn
              assert 'return alias_unique[0]' in fn
              assert fn.index('return alias_unique[0]') < fn.index('public_key[:12]')
          PY

      - name: Validate
        shell: bash
        run: |
          python -m py_compile source/Meshtastic_Broker.py source/Telegram_Bot_Broker.py
          python - <<'PY'
          import importlib.util
          files = [
              'tests/test_mc_observed_dm_prefix.py',
              'tests/test_mc_contactos_full_public_key.py',
              'tests/test_mc_dm_alias_confirmation.py',
          ]
          for i, fn in enumerate(files):
              spec = importlib.util.spec_from_file_location(f'reg{i}', fn)
              mod = importlib.util.module_from_spec(spec)
              spec.loader.exec_module(mod)
              for name in dir(mod):
                  if name.startswith('test_'):
                      getattr(mod, name)()
          PY
          git diff --check

      - name: Commit validated fix and remove temporary workflow
        shell: bash
        run: |
          rm .github/workflows/apply-mc-observed-dm-prefix.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add source/Meshtastic_Broker.py tests/test_mc_observed_dm_prefix.py .github/workflows/apply-mc-observed-dm-prefix.yml
          git commit -m "fix: prefer observed MeshCore DM prefix"
          git push origin HEAD:fix/mc-observed-dm-prefix
