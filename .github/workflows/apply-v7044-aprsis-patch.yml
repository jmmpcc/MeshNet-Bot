name: Apply v7.0.44 APRS-IS bot patch

on:
  push:
    branches:
      - agent/v7.0.44-aprsis-push-help

permissions:
  contents: write

jobs:
  apply-patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply validated patch
        run: |
          git apply --check tools/patches/v7.0.44-aprsis-push.patch
          git apply tools/patches/v7.0.44-aprsis-push.patch
          python -m py_compile source/Telegram_Bot_Broker.py
          git diff --check

      - name: Commit patched bot
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add source/Telegram_Bot_Broker.py
          git commit -m "v7.0.44: correct aprsis_push help and status"
          git push
