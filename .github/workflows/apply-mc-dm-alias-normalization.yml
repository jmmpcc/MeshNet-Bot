name: Apply MeshCore DM alias separator normalization

on:
  push:
    branches: ["fix/mc-dm-alias-separator-normalization"]

permissions:
  contents: write

jobs:
  apply-validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply isolated alias-key normalization
        run: |
          python - <<'PY'
          from pathlib import Path

          p = Path('source/Meshtastic_Broker.py')
          s = p.read_text(encoding='utf-8')

          pos = s.find('def _norm_text(')
          if pos < 0:
              raise SystemExit('No se encuentra _norm_text')

          cls_pos = s.find('\nclass MeshCoreEmbeddedBridge:', pos)
          if cls_pos < 0:
              raise SystemExit('No se encuentra MeshCoreEmbeddedBridge')

          helper = '''\n\ndef _meshcore_alias_key(value: str) -> str:\n    \"\"\"Devuelve una clave estable para comparar aliases de contactos MeshCore.\n\n    Se usa exclusivamente en la asociación alias -> prefix DM operativo. MeshCore\n    puede anunciar el mismo alias con espacios, guiones o guiones bajos según la\n    fuente (por ejemplo, ``EB2EAS-T1000E`` frente a ``EB2EAS T1000e``). Para no\n    alterar el texto visible ni otras normalizaciones del broker, esta función\n    convierte solo esos separadores en un único espacio, aplica ``casefold()`` y\n    colapsa espacios repetidos.\n\n    Parámetros:\n        value: alias recibido por RF, leído de contactos o configurado.\n\n    Retorno:\n        Clave normalizada usada únicamente para comparar identidades por alias.\n    \"\"\"\n    normalized = _norm_text(value or \"\").casefold()\n    normalized = re.sub(r\"[-_]+\", \" \", normalized)\n    return re.sub(r\"\\s+\", \" \", normalized).strip()\n'''

          if 'def _meshcore_alias_key(value: str) -> str:' not in s:
              s = s[:cls_pos] + helper + s[cls_pos:]

          old_remember = 'wanted = _norm_text(alias or "").casefold()'

          remember_start = s.find('    def _meshcore_remember_observed_dm_prefix')
          resolve_start = s.find('    def resolve_observed_dm_prefix', remember_start)
          display_start = s.find('    def _meshcore_contact_display', resolve_start)
          if min(remember_start, resolve_start, display_start) < 0:
              raise SystemExit('No se localizan los métodos DM')

          remember_block = s[remember_start:resolve_start]
          resolve_block = s[resolve_start:display_start]

          if old_remember not in remember_block or old_remember not in resolve_block:
              raise SystemExit('No se localizan los wanted esperados')

          remember_block = remember_block.replace(old_remember, 'wanted = _meshcore_alias_key(alias)', 1)
          resolve_block = resolve_block.replace(old_remember, 'wanted = _meshcore_alias_key(alias)', 1)
          resolve_block = resolve_block.replace(
              'if _norm_text(value).casefold() == wanted and str(key).strip():',
              'if _meshcore_alias_key(value) == wanted and str(key).strip():',
              1,
          )

          s = s[:remember_start] + remember_block + resolve_block + s[display_start:]
          p.write_text(s, encoding='utf-8')
          PY

      - name: Extend runtime regression with real alias format
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('tests/test_mc_dm_norm_runtime.py')
          s = p.read_text(encoding='utf-8')

          s = s.replace(
              '''    norm_node = next(\n        n for n in tree.body\n        if isinstance(n, ast.FunctionDef) and n.name == "_norm_text"\n    )\n''',
              '''    norm_node = next(\n        n for n in tree.body\n        if isinstance(n, ast.FunctionDef) and n.name == "_norm_text"\n    )\n    alias_key_node = next(\n        n for n in tree.body\n        if isinstance(n, ast.FunctionDef) and n.name == "_meshcore_alias_key"\n    )\n''',
              1,
          )
          s = s.replace(
              '''    exec(compile(ast.Module(body=[norm_node], type_ignores=[]), "<norm>", "exec"), ns)\n''',
              '''    exec(compile(ast.Module(body=[norm_node], type_ignores=[]), "<norm>", "exec"), ns)\n    exec(compile(ast.Module(body=[alias_key_node], type_ignores=[]), "<alias_key>", "exec"), ns)\n''',
              1,
          )

          extra = '''\n\ndef test_resolver_matches_rx_hyphen_alias_with_contact_space_alias() -> None:\n    \"\"\"Caso real: RX EB2EAS-T1000E debe resolver consulta EB2EAS T1000e.\"\"\"\n    ns = _runtime_namespace()\n    obj = _dummy()\n    ns[\"_meshcore_remember_observed_dm_prefix\"](\n        obj, \"EB2EAS-T1000E\", \"8B47FEA70A4B\"\n    )\n    assert ns[\"resolve_observed_dm_prefix\"](obj, \"EB2EAS T1000e\") == \"8b47fea70a4b\"\n\n\ndef test_resolver_matches_configured_underscore_alias_with_space_alias() -> None:\n    \"\"\"Los aliases configurados con '_' comparten la misma clave estable.\"\"\"\n    ns = _runtime_namespace()\n    obj = _dummy(aliases={\"8B47FEA70A4B\": \"EB2EAS_T1000E\"})\n    assert ns[\"resolve_observed_dm_prefix\"](obj, \"EB2EAS T1000e\") == \"8b47fea70a4b\"\n'''
          if 'test_resolver_matches_rx_hyphen_alias_with_contact_space_alias' not in s:
              s += extra
          p.write_text(s, encoding='utf-8')
          PY

      - name: Validate focused runtime behavior
        run: |
          python -m py_compile source/Meshtastic_Broker.py source/Telegram_Bot_Broker.py tests/test_mc_dm_norm_runtime.py
          python -m pip install -q pytest
          python -m pytest -q tests/test_mc_dm_norm_runtime.py tests/test_mc_dm_number_observed_prefix.py tests/test_mc_contactos_full_public_key.py tests/test_mc_dm_alias_confirmation.py
          git diff --check

      - name: Commit validated changes and remove temporary workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add source/Meshtastic_Broker.py tests/test_mc_dm_norm_runtime.py
          git commit -m "fix: normalize MeshCore DM alias separators"
          git rm .github/workflows/apply-mc-dm-alias-normalization.yml
          git commit -m "chore: remove temporary MeshCore alias validation workflow"
          git push origin HEAD:fix/mc-dm-alias-separator-normalization
