name: Retry MeshCore DM alias confirmation fix

on:
  push:
    branches:
      - fix/mc-dm-confirm-alias

permissions:
  contents: write

jobs:
  apply-and-validate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: fix/mc-dm-confirm-alias
          fetch-depth: 0

      - name: Reuse deterministic patch and test definition
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import textwrap

          workflow = Path('.github/workflows/apply-mc-dm-alias-confirm.yml').read_text(encoding='utf-8')

          patch_marker = "python - <<'PY'\n"
          patch = workflow.split(patch_marker, 1)[1].split("\n          PY", 1)[0]
          exec(compile(textwrap.dedent(patch), '<mc-dm-alias-patch>', 'exec'), {})

          test_marker = "cat > tests/test_mc_dm_alias_confirmation.py <<'PY'\n"
          test_source = workflow.split(test_marker, 1)[1].split("\n          PY", 1)[0]
          Path('tests/test_mc_dm_alias_confirmation.py').write_text(
              textwrap.dedent(test_source), encoding='utf-8'
          )
          PY

      - name: Validate without external test dependencies
        shell: bash
        run: |
          python -m py_compile source/Telegram_Bot_Broker.py
          python - <<'PY'
          import runpy

          for test_path in (
              'tests/test_mc_contactos_full_public_key.py',
              'tests/test_mc_dm_alias_confirmation.py',
          ):
              namespace = runpy.run_path(test_path)
              tests = [
                  (name, fn) for name, fn in namespace.items()
                  if name.startswith('test_') and callable(fn)
              ]
              if not tests:
                  raise SystemExit(f'Sin pruebas ejecutables en {test_path}')
              for name, fn in tests:
                  fn()
                  print(f'PASS {test_path}::{name}')
          PY
          git diff --check
          if grep -Fq 'Destino: {contact_prefix}' source/Telegram_Bot_Broker.py; then
            echo 'ERROR: sigue existiendo una confirmación pública con contact_prefix' >&2
            exit 1
          fi

      - name: Commit validated fix and remove temporary workflows
        shell: bash
        run: |
          rm .github/workflows/apply-mc-dm-alias-confirm.yml
          rm .github/workflows/retry-mc-dm-alias-confirm.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add source/Telegram_Bot_Broker.py tests/test_mc_dm_alias_confirmation.py .github/workflows/apply-mc-dm-alias-confirm.yml .github/workflows/retry-mc-dm-alias-confirm.yml
          git commit -m "fix: show MeshCore DM alias in confirmations"
          git push origin HEAD:fix/mc-dm-confirm-alias
