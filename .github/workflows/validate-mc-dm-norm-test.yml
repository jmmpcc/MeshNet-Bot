name: Validate MeshCore DM runtime test

on:
  push:
    branches: ["fix/mc-dm-norm-text-runtime"]

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run syntax and focused tests
        run: |
          python -m py_compile source/Meshtastic_Broker.py source/Telegram_Bot_Broker.py tests/test_mc_dm_norm_runtime.py
          python -m pip install -q pytest
          python -m pytest -q tests/test_mc_dm_norm_runtime.py tests/test_mc_dm_number_observed_prefix.py tests/test_mc_contactos_full_public_key.py tests/test_mc_dm_alias_confirmation.py
          git diff --check HEAD~1 HEAD
      - name: Remove temporary workflow
        if: success()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/validate-mc-dm-norm-test.yml
          git commit -m "chore: remove temporary MeshCore DM runtime test workflow"
          git push origin HEAD:fix/mc-dm-norm-text-runtime
