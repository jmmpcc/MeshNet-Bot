name: Apply MeshCore DM normalization fix

on:
  push:
    branches: ["fix/mc-dm-norm-text-runtime"]

permissions:
  contents: write

jobs:
  apply-validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply minimal broker helper
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('source/Meshtastic_Broker.py')
          src = path.read_text(encoding='utf-8')
          anchor = '''    return body or raw\n\nclass MeshCoreEmbeddedBridge:\n'''
          helper = '''    return body or raw\n\ndef _norm_text(value) -> str:\n    \"\"\"Normaliza texto para comparaciones internas del broker.\n\n    Se utiliza en la resolución de contactos MeshCore por alias. Mantiene la\n    misma semántica de normalización ya usada por los módulos bridge del\n    proyecto: convierte a texto, unifica saltos de línea, elimina espacios\n    laterales y colapsa espacios internos.\n\n    Parámetros:\n        value: valor textual o convertible a texto que se desea normalizar.\n\n    Retorna:\n        Texto normalizado; cadena vacía para valores vacíos/None.\n    \"\"\"\n    text = str(value or \"\").replace(\"\\r\\n\", \"\\n\").replace(\"\\r\", \"\\n\").strip()\n    return \" \".join(text.split())\n\n\nclass MeshCoreEmbeddedBridge:\n'''
          assert anchor in src, 'anchor not found'
          assert 'def _norm_text(value)' not in src, 'helper already exists'
          src = src.replace(anchor, helper, 1)
          path.write_text(src, encoding='utf-8')
          PY

      - name: Runtime regression for resolver
        shell: bash
        run: |
          python -m py_compile source/Meshtastic_Broker.py source/Telegram_Bot_Broker.py
          python - <<'PY'
          import ast
          import re
          import textwrap
          from pathlib import Path

          source = Path('source/Meshtastic_Broker.py').read_text(encoding='utf-8')
          tree = ast.parse(source)

          norm_node = next(
              n for n in tree.body
              if isinstance(n, ast.FunctionDef) and n.name == '_norm_text'
          )
          cls = next(
              n for n in tree.body
              if isinstance(n, ast.ClassDef) and n.name == 'MeshCoreEmbeddedBridge'
          )
          remember_node = next(
              n for n in cls.body
              if isinstance(n, ast.FunctionDef) and n.name == '_meshcore_remember_observed_dm_prefix'
          )
          resolve_node = next(
              n for n in cls.body
              if isinstance(n, ast.FunctionDef) and n.name == 'resolve_observed_dm_prefix'
          )

          ns = {'re': re}
          exec(compile(ast.Module(body=[norm_node], type_ignores=[]), '<norm>', 'exec'), ns)

          remember_src = textwrap.dedent(ast.get_source_segment(source, remember_node))
          resolve_src = textwrap.dedent(ast.get_source_segment(source, resolve_node))
          exec(compile(remember_src, '<remember>', 'exec'), ns)
          exec(compile(resolve_src, '<resolve>', 'exec'), ns)

          class Dummy:
              pass

          d = Dummy()
          d._mc_observed_dm_prefixes_by_alias = {}
          d.contact_aliases = {}

          ns['_meshcore_remember_observed_dm_prefix'](d, '  EB2EAS   T1000e  ', '8B47FEA70A4B')
          got = ns['resolve_observed_dm_prefix'](d, 'EB2EAS T1000e')
          assert got == '8b47fea70a4b', got

          d2 = Dummy()
          d2._mc_observed_dm_prefixes_by_alias = {}
          d2.contact_aliases = {'8B47FEA70A4B': ' EB2EAS   T1000e '}
          got2 = ns['resolve_observed_dm_prefix'](d2, 'EB2EAS T1000e')
          assert got2 == '8b47fea70a4b', got2

          print('runtime resolver OK:', got, got2)
          PY
          python -m pip install -q pytest
          python -m pytest -q tests/test_mc_dm_number_observed_prefix.py tests/test_mc_contactos_full_public_key.py tests/test_mc_dm_alias_confirmation.py
          git diff --check

      - name: Commit validated fix and remove temporary workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add source/Meshtastic_Broker.py
          git commit -m "fix: define broker text normalization for MeshCore DM resolver"
          git rm .github/workflows/apply-mc-dm-norm-fix.yml
          git commit -m "chore: remove temporary MeshCore DM validation workflow"
          git push origin HEAD:fix/mc-dm-norm-text-runtime
