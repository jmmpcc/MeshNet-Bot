name: Apply MeshCore DM from_name learning fix

on:
  push:
    branches: ["fix/mc-dm-learn-from-name-final"]

permissions:
  contents: write

jobs:
  apply-validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Patch isolated RX learning fallback
        run: |
          python - <<'PY'
          from pathlib import Path

          p = Path('source/Meshtastic_Broker.py')
          s = p.read_text(encoding='utf-8')

          old = '''                # Conserva de forma aislada el prefix DM visto realmente en RF.\n                # Se usa data["pubkey_prefix"] y no ``pref`` porque este último puede\n                # haber sido derivado como fallback cuando el evento no trae prefix.\n                self._meshcore_remember_observed_dm_prefix(\n                    alias, str(data.get("pubkey_prefix") or "").strip()\n                )\n'''

          new = '''                # Conserva de forma aislada el prefix DM visto realmente en RF.\n                # El alias operativo puede llegar enriquecido como ``from_name`` aunque\n                # ``alias``/``name`` no estén presentes en el evento. Usamos ``from_name``\n                # únicamente como fallback para esta asociación interna, sin modificar\n                # el alias visible ni el flujo existente. El prefix sigue siendo el\n                # ``data["pubkey_prefix"]`` real, nunca el ``pref`` derivado por fallback.\n                observed_alias = alias or str(data.get("from_name") or "").strip()\n                self._meshcore_remember_observed_dm_prefix(\n                    observed_alias, str(data.get("pubkey_prefix") or "").strip()\n                )\n'''

          if old not in s:
              raise SystemExit('Bloque RX esperado no encontrado; no se aplica nada')
          s = s.replace(old, new, 1)
          p.write_text(s, encoding='utf-8')
          PY

      - name: Update focused regression
        run: |
          python - <<'PY'
          from pathlib import Path

          p = Path('tests/test_mc_dm_number_observed_prefix.py')
          s = p.read_text(encoding='utf-8')

          old = '''def test_rx_learns_only_literal_event_prefix() -> None:\n    source = BROKER.read_text(encoding='utf-8')\n    assert 'self._meshcore_remember_observed_dm_prefix(' in source\n    assert 'alias, str(data.get("pubkey_prefix") or "").strip()' in source\n    assert 'self.contact_aliases[pref] = alias' not in source\n'''

          new = '''def test_rx_learns_literal_prefix_with_from_name_fallback() -> None:\n    \"\"\"El RX real puede traer from_name sin alias/name y debe aprender el prefix RF.\"\"\"\n    fn = function_source(BROKER, '_on_msg')\n    assert 'observed_alias = alias or str(data.get("from_name") or "").strip()' in fn\n    assert 'observed_alias, str(data.get("pubkey_prefix") or "").strip()' in fn\n    assert 'self.contact_aliases[pref] = alias' not in fn\n    assert 'alias = str(data.get("alias") or data.get("name") or "").strip()' in fn\n    assert 'alias = str(data.get("from_name")' not in fn\n'''

          if old not in s:
              raise SystemExit('Test RX esperado no encontrado; no se modifica')
          s = s.replace(old, new, 1)
          p.write_text(s, encoding='utf-8')
          PY

      - name: Validate focused behavior
        run: |
          python -m py_compile source/Meshtastic_Broker.py source/Telegram_Bot_Broker.py tests/test_mc_dm_number_observed_prefix.py tests/test_mc_dm_norm_runtime.py
          python -m pip install -q pytest
          python -m pytest -q tests/test_mc_dm_number_observed_prefix.py tests/test_mc_dm_norm_runtime.py tests/test_mc_contactos_full_public_key.py tests/test_mc_dm_alias_confirmation.py
          git diff --check

      - name: Commit validated changes and remove temporary workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add source/Meshtastic_Broker.py tests/test_mc_dm_number_observed_prefix.py
          git commit -m "fix: learn MeshCore DM prefix from enriched sender name"
          git rm .github/workflows/apply-mc-dm-from-name-fix.yml
          git commit -m "chore: remove temporary MeshCore DM validation workflow"
          git push origin HEAD:fix/mc-dm-learn-from-name-final
