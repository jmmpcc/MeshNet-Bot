name: Apply full MeshCore public key mapping

on:
  push:
    branches:
      - fix/mc-dm-confirm-alias-current

permissions:
  contents: write

jobs:
  apply-and-validate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: fix/mc-dm-confirm-alias-current
          fetch-depth: 0

      - name: Apply minimal mapping change
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('source/Telegram_Bot_Broker.py')
          s = p.read_text(encoding='utf-8')
          old = '''        # La lista pública muestra únicamente número y alias.\n        # El identificador MeshCore permanece interno: el número se resuelve mediante mc_map\n        # y /dm_mc N texto continúa enviando al mismo dm_key sin exponer claves al usuario.\n        name = (c.get("name") or "Sin nombre").strip()\n        mc_map[str(idx)] = dm_key\n        mc_alias_map[str(idx)] = name\n'''
          new = '''        # La lista pública muestra únicamente número y alias.\n        # La referencia autoritativa interna es la public_key completa cuando el\n        # broker la proporciona. El dm_key corto se conserva solo como fallback\n        # compatible para contactos legacy que no expongan public_key.\n        name = (c.get("name") or "Sin nombre").strip()\n        routing_key = public_key or dm_key\n        mc_map[str(idx)] = routing_key\n        mc_alias_map[str(idx)] = name\n'''
          if s.count(old) != 1:
              raise SystemExit(f'expected exact mapping block once, found {s.count(old)}')
          p.write_text(s.replace(old, new, 1), encoding='utf-8')
          PY

      - name: Update regressions
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          p = Path('tests/test_mc_dm_alias_confirmation.py')
          s = p.read_text(encoding='utf-8')
          marker = '''    assert 'context.user_data["mc_contacts_alias_map"] = mc_alias_map' in source\n'''
          replacement = marker + '''    assert 'routing_key = public_key or dm_key' in source\n    assert 'mc_map[str(idx)] = routing_key' in source\n'''
          if marker not in s:
              raise SystemExit('alias confirmation test marker not found')
          p.write_text(s.replace(marker, replacement, 1), encoding='utf-8')

          p2 = Path('tests/test_mc_contactos_full_public_key.py')
          s2 = p2.read_text(encoding='utf-8')
          old = '''    # Regresión: /dm_mc N y los botones siguen resolviendo internamente por dm_key.\n    assert 'mc_map[str(idx)] = dm_key' in fn\n    assert 'callback_data=f"mc_dm:{idx}:{dm_key[:32]}"' in fn\n'''
          new = '''    # Regresión: /dm_mc N usa la public_key completa cuando está disponible.\n    # El callback corto se conserva solo como fallback compatible con el límite\n    # de callback_data de Telegram; el mapa interno es la ruta autoritativa.\n    assert 'routing_key = public_key or dm_key' in fn\n    assert 'mc_map[str(idx)] = routing_key' in fn\n    assert 'callback_data=f"mc_dm:{idx}:{dm_key[:32]}"' in fn\n'''
          if s2.count(old) != 1:
              raise SystemExit(f'contactos regression block expected once, found {s2.count(old)}')
          p2.write_text(s2.replace(old, new, 1), encoding='utf-8')
          PY

      - name: Validate
        shell: bash
        run: |
          python -m py_compile source/Telegram_Bot_Broker.py
          python - <<'PY'
          import importlib.util
          for i, fn in enumerate(['tests/test_mc_contactos_full_public_key.py', 'tests/test_mc_dm_alias_confirmation.py']):
              spec = importlib.util.spec_from_file_location(f'reg{i}', fn)
              mod = importlib.util.module_from_spec(spec)
              spec.loader.exec_module(mod)
              for name in dir(mod):
                  if name.startswith('test_'):
                      getattr(mod, name)()
          PY
          git diff --check
          grep -n "routing_key = public_key or dm_key" source/Telegram_Bot_Broker.py
          grep -n "mc_map\[str(idx)\] = routing_key" source/Telegram_Bot_Broker.py
          grep -n "_send_via_broker_meshcore_contact, contact_prefix" source/Telegram_Bot_Broker.py

      - name: Commit and remove temporary workflow
        shell: bash
        run: |
          rm .github/workflows/apply-mc-full-public-key-map.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add source/Telegram_Bot_Broker.py tests/test_mc_dm_alias_confirmation.py tests/test_mc_contactos_full_public_key.py .github/workflows/apply-mc-full-public-key-map.yml
          git commit -m "fix: keep full MeshCore public key behind contact numbers"
          git push origin HEAD:fix/mc-dm-confirm-alias-current
