name: Apply focused mc_contactos privacy fix

on:
  push:
    branches:
      - fix/mc-contactos-hide-internal-ids

permissions:
  contents: write

jobs:
  apply-fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: fix/mc-contactos-hide-internal-ids
          fetch-depth: 0

      - name: Apply minimal source change and focused regression test
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          source_path = Path("source/Telegram_Bot_Broker.py")
          text = source_path.read_text(encoding="utf-8")

          old_meta = '''        meta = []
          if contact_id and contact_id != display_prefix and contact_id != dm_key:
              meta.append(f"id: {contact_id}")
          # No mostramos un segundo [MC:...] para DM: el identificador correcto
          # para enviar es el prefijo corto mostrado en la primera línea.
          last_seen_txt = _format_meshcore_last_seen(ls)
          '''
          new_meta = '''        # La consulta muestra únicamente información útil para el usuario.
          # Los identificadores MeshCore permanecen en mc_map/dm_key y nunca se
          # exponen en la respuesta; /dm_mc N texto conserva la resolución numérica.
          meta = []
          last_seen_txt = _format_meshcore_last_seen(ls)
          '''

          old_render = '''        lines.append(
              f"<b>{idx:02d}.</b> 📡 <b>{escape(name)}</b>\\n"
              f"    <code>[MC:{escape(display_prefix)}]</code>{escape(meta_txt)}"
          )
          '''
          new_render = '''        lines.append(
              f"<b>{idx:02d}.</b> 📡 <b>{escape(name)}</b>{escape(meta_txt)}"
          )
          '''

          if text.count(old_meta) != 1:
              raise SystemExit(f"Expected exactly one metadata block, found {text.count(old_meta)}")
          if text.count(old_render) != 1:
              raise SystemExit(f"Expected exactly one render block, found {text.count(old_render)}")

          text = text.replace(old_meta, new_meta, 1)
          text = text.replace(old_render, new_render, 1)
          source_path.write_text(text, encoding="utf-8")

          test_path = Path("tests/test_mc_contactos_hide_internal_ids.py")
          test_path.write_text('''from pathlib import Path


def _mc_contactos_source() -> str:
    """Extrae solo mc_contactos_cmd para validar su contrato visual sin ejecutar el bot."""
    source = Path("source/Telegram_Bot_Broker.py").read_text(encoding="utf-8")
    start = source.index("async def mc_contactos_cmd(")
    end = source.index("\\nasync def ", start + 1)
    return source[start:end]


def test_mc_contactos_hides_meshcore_identifiers_but_keeps_numeric_dm_mapping():
    """La lista no expone IDs y mantiene intacta la resolución N -> dm_key."""
    body = _mc_contactos_source()

    assert "[MC:" not in body
    assert 'meta.append(f"id:' not in body
    assert 'mc_map[str(idx)] = dm_key' in body
    assert 'callback_data=f"mc_dm:{idx}:{dm_key[:32]}"' in body
    assert "/dm_mc N texto" in body
''', encoding="utf-8")
          PY

      - name: Validate Python syntax and focused regression test
        shell: bash
        run: |
          python -m py_compile source/Telegram_Bot_Broker.py
          python -m pytest -q tests/test_mc_contactos_hide_internal_ids.py

      - name: Remove temporary workflow and commit final changes
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/apply-mc-contactos-privacy-fix.yml
          git add source/Telegram_Bot_Broker.py tests/test_mc_contactos_hide_internal_ids.py
          git commit -m "fix: hide MeshCore identifiers in mc_contactos"
          git push origin HEAD:fix/mc-contactos-hide-internal-ids
