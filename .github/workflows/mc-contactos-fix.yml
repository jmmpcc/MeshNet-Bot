name: One-shot mc_contactos fix

on:
  push:
    branches: [fix/mc-contactos-hide-internal-ids]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/mc-contactos-hide-internal-ids
          fetch-depth: 0

      - name: Apply exact minimal change
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('source/Telegram_Bot_Broker.py')
          text = path.read_text(encoding='utf-8')

          old = '''        meta = []
          if contact_id and contact_id != display_prefix and contact_id != dm_key:
              meta.append(f"id: {contact_id}")
          # No mostramos un segundo [MC:...] para DM: el identificador correcto
          # para enviar es el prefijo corto mostrado en la primera línea.
          last_seen_txt = _format_meshcore_last_seen(ls)
          if last_seen_txt:
              meta.append(f"visto: {last_seen_txt}")
          meta_txt = f" · {' · '.join(meta)}" if meta else ""
          lines.append(
              f"<b>{idx:02d}.</b> 📡 <b>{escape(name)}</b>\\n"
              f"    <code>[MC:{escape(display_prefix)}]</code>{escape(meta_txt)}"
          )
          '''

          new = '''        # La consulta muestra solo información útil para el usuario.
          # Los identificadores MeshCore permanecen internos en mc_map/dm_key;
          # /dm_mc N texto conserva exactamente la resolución numérica existente.
          meta = []
          last_seen_txt = _format_meshcore_last_seen(ls)
          if last_seen_txt:
              meta.append(f"visto: {last_seen_txt}")
          meta_txt = f" · {' · '.join(meta)}" if meta else ""
          lines.append(
              f"<b>{idx:02d}.</b> 📡 <b>{escape(name)}</b>{escape(meta_txt)}"
          )
          '''

          count = text.count(old)
          if count != 1:
              raise SystemExit(f'Bloque esperado no encontrado de forma única: {count}')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')

          test = Path('tests/test_mc_contactos_hide_internal_ids.py')
          test.write_text('''from pathlib import Path


def _mc_contactos_source() -> str:
    """Extrae mc_contactos_cmd sin importar el bot ni abrir conexiones."""
    source = Path("source/Telegram_Bot_Broker.py").read_text(encoding="utf-8")
    start = source.index("async def mc_contactos_cmd(")
    end = source.index("\\nasync def ", start + 1)
    return source[start:end]


def test_mc_contactos_hides_ids_and_keeps_numeric_dm_mapping():
    """La salida oculta IDs y mantiene N -> dm_key y los botones DM."""
    body = _mc_contactos_source()
    assert "[MC:" not in body
    assert 'meta.append(f"id:' not in body
    assert 'mc_map[str(idx)] = dm_key' in body
    assert 'callback_data=f"mc_dm:{idx}:{dm_key[:32]}"' in body
    assert "/dm_mc N texto" in body
''', encoding='utf-8')
          PY

      - name: Validate syntax and focused regression
        run: |
          python3 -m py_compile source/Telegram_Bot_Broker.py
          python3 -m pytest -q tests/test_mc_contactos_hide_internal_ids.py
          git diff --check

      - name: Commit only intended files
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/mc-contactos-fix.yml
          git add source/Telegram_Bot_Broker.py tests/test_mc_contactos_hide_internal_ids.py
          git diff --cached --check
          git commit -m 'fix: hide MeshCore identifiers in mc_contactos'
          git push origin HEAD:fix/mc-contactos-hide-internal-ids
