name: Fix MeshCore explicit contact prefix priority

on:
  push:
    branches:
      - fix/mc-contact-explicit-prefix-priority

permissions:
  contents: write

jobs:
  apply-and-validate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: fix/mc-contact-explicit-prefix-priority
          fetch-depth: 0

      - name: Prioritize explicit MeshCore prefix
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('source/Meshtastic_Broker.py')
          s = p.read_text(encoding='utf-8')

          replacements = {
              'display_prefix = c.get("pubkey_prefix") or c.get("key_prefix")\n                    contact_id = c.get("id") or c.get("prefix")':
              'display_prefix = c.get("pubkey_prefix") or c.get("key_prefix") or c.get("prefix")\n                    contact_id = c.get("id")',
              'display_prefix = getattr(c, "pubkey_prefix", None) or getattr(c, "key_prefix", None)\n                    contact_id = getattr(c, "id", None) or getattr(c, "prefix", None)':
              'display_prefix = getattr(c, "pubkey_prefix", None) or getattr(c, "key_prefix", None) or getattr(c, "prefix", None)\n                    contact_id = getattr(c, "id", None)',
          }

          for old, new in replacements.items():
              count = s.count(old)
              if count != 1:
                  raise SystemExit(f'expected block once, found {count}: {old!r}')
              s = s.replace(old, new, 1)

          p.write_text(s, encoding='utf-8')
          PY

      - name: Validate
        shell: bash
        run: |
          python -m py_compile source/Meshtastic_Broker.py source/Telegram_Bot_Broker.py
          python - <<'PY'
          import runpy
          for fn in [
              'tests/test_meshcore_contacts_explicit_prefix.py',
              'tests/test_mc_contactos_full_public_key.py',
              'tests/test_mc_dm_alias_confirmation.py',
          ]:
              ns = runpy.run_path(fn)
              for name, obj in ns.items():
                  if name.startswith('test_') and callable(obj):
                      obj()
          PY
          git diff --check
          grep -n 'display_prefix = c.get("pubkey_prefix") or c.get("key_prefix") or c.get("prefix")' source/Meshtastic_Broker.py
          grep -n 'display_prefix = getattr(c, "pubkey_prefix", None) or getattr(c, "key_prefix", None) or getattr(c, "prefix", None)' source/Meshtastic_Broker.py
          ! grep -n 'contact_id = c.get("id") or c.get("prefix")' source/Meshtastic_Broker.py
          ! grep -n 'contact_id = getattr(c, "id", None) or getattr(c, "prefix", None)' source/Meshtastic_Broker.py

      - name: Commit validated fix and remove temporary workflow
        shell: bash
        run: |
          rm .github/workflows/fix-mc-contact-explicit-prefix.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add source/Meshtastic_Broker.py tests/test_meshcore_contacts_explicit_prefix.py .github/workflows/fix-mc-contact-explicit-prefix.yml
          git commit -m "fix: prefer explicit MeshCore contact prefix for DM"
          git push origin HEAD:fix/mc-contact-explicit-prefix-priority
