name: Apply mc_contactos full public key fix

on:
  push:
    branches:
      - fix/mc-contactos-full-public-key

permissions:
  contents: write

jobs:
  apply-fix:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: fix/mc-contactos-full-public-key
          fetch-depth: 0

      - name: Apply minimal presentation-only fix
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('source/Telegram_Bot_Broker.py')
          src = path.read_text(encoding='utf-8')

          anchor = '        name = (c.get("name") or "Sin nombre").strip()\n'
          if src.count(anchor) != 1:
              raise SystemExit(f'Unexpected name anchor count: {src.count(anchor)}')
          src = src.replace(
              anchor,
              '        # ID canónico del contacto: MeshCore identifica cada nodo por su public_key Ed25519 completa.\n'
              '        # El dm_key se mantiene separado e intacto porque send_msg resuelve el destino por prefijo.\n'
              '        canonical_id = public_key or display_prefix or contact_id or dm_key\n'
              + anchor,
              1,
          )

          old_comment = (
              '        # No mostramos un segundo [MC:...] para DM: el identificador correcto\n'
              '        # para enviar es el prefijo corto mostrado en la primera línea.\n'
          )
          new_comment = (
              '        # Mostramos la identidad MeshCore completa y, por separado, el prefijo usado para DM.\n'
              '        # Esto corrige únicamente la presentación; mc_map, botones y /dm_mc siguen usando dm_key.\n'
          )
          if src.count(old_comment) != 1:
              raise SystemExit(f'Unexpected comment anchor count: {src.count(old_comment)}')
          src = src.replace(old_comment, new_comment, 1)

          old_line = '            f"    <code>[MC:{escape(display_prefix)}]</code>{escape(meta_txt)}"\n'
          new_lines = (
              '            f"    ID: <code>[MC:{escape(canonical_id)}]</code>\\n"\n'
              '            f"    DM: <code>{escape(dm_key)}</code>{escape(meta_txt)}"\n'
          )
          if src.count(old_line) != 1:
              raise SystemExit(f'Unexpected display anchor count: {src.count(old_line)}')
          src = src.replace(old_line, new_lines, 1)

          path.write_text(src, encoding='utf-8')

          test_path = Path('tests/test_mc_contactos_full_public_key.py')
          test_path.write_text('''from __future__ import annotations\n\nimport ast\nfrom pathlib import Path\n\n\ndef _mc_contactos_source() -> str:\n    source_path = Path(__file__).resolve().parents[1] / "source" / "Telegram_Bot_Broker.py"\n    source = source_path.read_text(encoding="utf-8")\n    tree = ast.parse(source)\n    for node in tree.body:\n        if isinstance(node, ast.AsyncFunctionDef) and node.name == "mc_contactos_cmd":\n            segment = ast.get_source_segment(source, node)\n            assert segment is not None\n            return segment\n    raise AssertionError("mc_contactos_cmd no encontrada")\n\n\ndef test_mc_contactos_muestra_public_key_completa_y_conserva_dm_key() -> None:\n    \"\"\"La UI muestra el ID canónico sin cambiar la clave corta usada para DM.\"\"\"\n    fn = _mc_contactos_source()\n\n    assert "canonical_id = public_key or display_prefix or contact_id or dm_key" in fn\n    assert 'ID: <code>[MC:{escape(canonical_id)}]</code>' in fn\n    assert 'DM: <code>{escape(dm_key)}</code>' in fn\n\n    # Regresión: la resolución numérica y el callback deben seguir usando dm_key.\n    assert 'mc_map[str(idx)] = dm_key' in fn\n    assert 'callback_data=f"mc_dm:{idx}:{dm_key[:32]}"' in fn\n\n\ndef test_telegram_bot_broker_sigue_siendo_python_valido() -> None:\n    source_path = Path(__file__).resolve().parents[1] / "source" / "Telegram_Bot_Broker.py"\n    ast.parse(source_path.read_text(encoding="utf-8"))\n''', encoding='utf-8')
          PY

      - name: Validate syntax and regression test
        shell: bash
        run: |
          python -m py_compile source/Telegram_Bot_Broker.py
          python -m pytest -q tests/test_mc_contactos_full_public_key.py

      - name: Remove temporary workflow and commit fix
        shell: bash
        run: |
          rm -f .github/workflows/apply-mc-contactos-id-fix.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "fix: show full MeshCore contact public key"
          git push origin HEAD:fix/mc-contactos-full-public-key
