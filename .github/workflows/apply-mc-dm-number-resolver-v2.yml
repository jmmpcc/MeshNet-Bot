name: Apply isolated MeshCore DM number resolver v2

on:
  push:
    branches: ["fix/mc-dm-number-resolver"]

permissions:
  contents: write

jobs:
  apply-validate-push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Reuse exact implementation script from v1
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          workflow = Path('.github/workflows/apply-mc-dm-number-resolver.yml').read_text(encoding='utf-8')
          start_marker = "          python - <<'PY'\n"
          start = workflow.index(start_marker) + len(start_marker)
          end = workflow.index("\n          PY\n", start)
          script = workflow[start:end]
          script = "\n".join(line[10:] if line.startswith("          ") else line for line in script.splitlines())
          exec(compile(script, '<resolver-apply>', 'exec'), {'__name__': '__main__'})
          PY

      - name: Reuse exact regression test from v1
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          workflow = Path('.github/workflows/apply-mc-dm-number-resolver.yml').read_text(encoding='utf-8')
          marker = "          cat > tests/test_mc_dm_number_observed_prefix.py <<'PY'\n"
          start = workflow.index(marker) + len(marker)
          end = workflow.index("\n          PY\n", start)
          test_source = workflow[start:end]
          test_source = "\n".join(line[10:] if line.startswith("          ") else line for line in test_source.splitlines()) + "\n"
          Path('tests/test_mc_dm_number_observed_prefix.py').write_text(test_source, encoding='utf-8')
          PY

      - name: Validate syntax and regressions
        shell: bash
        run: |
          python -m py_compile source/Meshtastic_Broker.py source/Telegram_Bot_Broker.py
          python -m pip install -q pytest
          python -m pytest -q \
            tests/test_mc_dm_number_observed_prefix.py \
            tests/test_mc_contactos_full_public_key.py \
            tests/test_mc_dm_alias_confirmation.py
          git diff --check

      - name: Commit validated implementation and remove temporary workflows
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add source/Meshtastic_Broker.py source/Telegram_Bot_Broker.py tests/test_mc_dm_number_observed_prefix.py
          git commit -m "fix: resolve MeshCore DM number using observed RF prefix"
          git rm \
            .github/workflows/apply-mc-dm-number-resolver.yml \
            .github/workflows/apply-mc-dm-number-resolver-v2.yml
          git commit -m "chore: remove temporary DM resolver workflows"
          git push origin HEAD:fix/mc-dm-number-resolver
