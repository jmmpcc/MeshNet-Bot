name: Finalize v7.0.45 province resolution

on:
  push:
    branches:
      - agent/v7.0.45-province-georesolution
    paths:
      - .github/workflows/build-v7045-province-boundaries.yml

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/v7.0.45-province-georesolution
      - name: Apply final minimal corrections
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          engine_path = Path('tools/emergencias_guardia/emergencias/engine.py')
          engine = engine_path.read_text(encoding='utf-8')
          old = (
              '            events, not_modified = source_type(source_id, source_config, config).fetch()\n'
              '            filtered = {event.event_id: event for event in events if event_matches(event, config)}\n'
          )
          new = (
              '            events, not_modified = source_type(source_id, source_config, config).fetch()\n'
              '            _enrich_events_for_province_areas(events, config)\n'
              '            filtered = {event.event_id: event for event in events if event_matches(event, config)}\n'
          )
          if new not in engine:
              assert engine.count(old) == 1, 'No se localiza el bloque exacto fetch -> filtro'
              engine = engine.replace(old, new, 1)
          assert engine.count(new) == 1
          engine_path.write_text(engine, encoding='utf-8', newline='\n')

          panel_path = Path('tools/ControlPanel/web_admin.py')
          panel = panel_path.read_text(encoding='utf-8')
          panel = panel.replace('UI 2 · v7.0.43', 'UI 2 · v7.0.45', 1)
          assert 'UI 2 · v7.0.45' in panel
          panel_path.write_text(panel, encoding='utf-8', newline='\n')
          PY
      - name: Validate final v7.0.45 pipeline
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile \
            tools/emergencias_guardia/emergencias/geo_admin.py \
            tools/emergencias_guardia/emergencias/engine.py \
            tools/ControlPanel/web_admin.py
          python3 -m pip install -q pytest
          python3 -m pytest \
            tests/test_emergency_province_resolution_v7045.py \
            tests/test_emergency_sources_v7043.py -v
          git diff --check
          python3 - <<'PY'
          import json
          from tools.emergencias_guardia.emergencias.geo_admin import resolve_province
          data=json.load(open('tools/emergencias_guardia/data/provincias_espana.geojson',encoding='utf-8'))
          assert len(data['features']) == 52
          assert resolve_province(41.6488, -0.8891) == 'Zaragoza'
          assert resolve_province(42.1401, -0.4089) == 'Huesca'
          PY
      - name: Commit final corrections
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            tools/emergencias_guardia/emergencias/engine.py \
            tools/ControlPanel/web_admin.py
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m 'v7.0.45: finalize province fetch integration'
          git push origin HEAD:agent/v7.0.45-province-georesolution
