name: Finalize v7.0.46 APRS-IS URL integrity

on:
  push:
    branches:
      - agent/v7.0.46-aprsis-url-integrity
    paths:
      - .github/workflows/build-v7046-aprsis-url-integrity.yml

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/v7.0.46-aprsis-url-integrity
          fetch-depth: 0
      - name: Update version history
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('docs/Historial_Versiones.md')
          text=p.read_text(encoding='utf-8')
          header='''## v7.0.46 — Integridad de URL y diagnóstico APRS-IS largo\n\n- Las URL de mapa en mensajes compactos se incluyen completas o se eliminan completas.\n- Se evita cualquier enlace parcial como `https://maps.`.\n- Se añade `aprsis_long_test`, exclusivamente APRS-IS y desactivado por defecto.\n- `BLNx`, APRS RF, deduplicación y `MIN_INTERVAL` permanecen sin cambios.\n- La salida APRS-IS automática ampliada queda pendiente de validación real en aprs.fi.\n\n'''
          if not text.startswith('## v7.0.46'):
              text=header+text
          p.write_text(text,encoding='utf-8',newline='\n')
          PY
      - name: Final validation
        run: |
          set -euo pipefail
          python3 -m py_compile tools/emergencias_guardia/emergencias/formatters.py source/meshtastic_to_aprs.py tools/emergencias_guardia/emergencias/emergency_dispatcher.py tools/ControlPanel/web_admin.py
          python3 -m pip install -q pytest
          python3 -m pytest tests/test_aprsis_url_integrity_v7046.py tests/test_aprsis_emergency_bulletin.py tests/test_emergency_dispatcher.py tests/test_emergency_sources_v7043.py tests/test_emergency_province_resolution_v7045.py -q
          git diff --check
      - name: Commit history
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/Historial_Versiones.md
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'v7.0.46: update version history'
          git push origin HEAD:agent/v7.0.46-aprsis-url-integrity
