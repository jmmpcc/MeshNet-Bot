name: Integrate v7.0.47 APRS-IS long bulletin test

on:
  push:
    branches:
      - agent/aprsis-bulletin-groups
    paths:
      - .github/workflows/build-v7047-aprsis-long-bulletin.yml

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/aprsis-bulletin-groups
          fetch-depth: 0

      - name: Apply isolated v7.0.47 diagnostic
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path('source/meshtastic_to_aprs.py')
          text = path.read_text(encoding='utf-8')
          text = text.replace('meshtastic_to_aprs.py (v7.0.46)', 'meshtastic_to_aprs.py (v7.0.47)', 1)

          cfg = 'APRSIS_LONG_TEST_MAX_CHARS = max(80, min(450, int(os.getenv("APRSIS_LONG_TEST_MAX_CHARS", "400") or "400")))\n'
          assert text.count(cfg) == 1
          text = text.replace(cfg, cfg + 'APRSIS_LONG_BULLETIN_TEST_ENABLED = int(os.getenv("APRSIS_LONG_BULLETIN_TEST_ENABLED", "0") or "0")\n', 1)

          marker = '\ndef _aprsis_tnc2_message_line(dst_call: str, text: str, *, with_msgid: bool = True) -> str:\n'
          assert text.count(marker) == 1
          fn = '''\n\nasync def send_aprsis_long_bulletin_test(text: str, bulletin_number: int = 0) -> dict:\n    """Envía manualmente un BLNx largo exclusivamente a APRS-IS.\n\n    Uso interno/diagnóstico:\n        await send_aprsis_long_bulletin_test(text, 0)\n\n    Parámetros:\n        text: cuerpo de prueba; no se aplica MAX_MSG_LEN=67.\n        bulletin_number: línea BLN0..BLN9 que se utilizará.\n\n    Funcionalidad:\n        - Requiere APRSIS_LONG_BULLETIN_TEST_ENABLED=1.\n        - Construye un verdadero APRS Message/Bulletin ::BLNx     :texto.\n        - Respeta el grupo configurado; grupo vacío produce BLN0..BLN9.\n        - Limita solo por APRSIS_LONG_TEST_MAX_CHARS para proteger la línea.\n        - Usa exclusivamente la conexión APRS-IS; nunca KISS/RF.\n        - No usa ni modifica estado, deduplicación, MIN_INTERVAL ni slots\n          de las emergencias automáticas.\n    """\n    if not bool(APRSIS_LONG_BULLETIN_TEST_ENABLED):\n        return {"ok": True, "sent": False, "reason": "disabled"}\n    if not _aprsis_ready():\n        return {"ok": False, "sent": False, "reason": "aprsis_unavailable"}\n\n    clean = _aprs_ascii(text).strip()\n    if not clean:\n        return {"ok": False, "sent": False, "reason": "empty_text"}\n    clean = clean[:APRSIS_LONG_TEST_MAX_CHARS]\n\n    try:\n        number = max(0, min(9, int(bulletin_number)))\n    except Exception:\n        number = 0\n    bulletin = _aprsis_bulletin_name(number)\n    src = (APRSIS_USER or MY_CALL or "").strip().upper()\n    if not src:\n        return {"ok": False, "sent": False, "reason": "missing_source"}\n\n    dst9 = bulletin[:9].ljust(9, " ")\n    line = f"{src}>APRS,TCPIP*::{dst9}:{clean}"\n    sent = bool(await _aprsis_send_line_safe(line))\n    return {\n        "ok": sent,\n        "sent": sent,\n        "reason": "sent" if sent else "send_failed",\n        "bulletin": bulletin,\n        "chars": len(clean),\n        "text": clean,\n        "line": line,\n    }\n'''
          text = text.replace(marker, fn + marker, 1)

          ctrl = '        # --- v7.0.46: diagnóstico manual largo, solo APRS-IS ---\n        if mode == "aprsis_long_test":\n'
          assert text.count(ctrl) == 1
          block = '''        # --- v7.0.47: diagnóstico BLNx largo, exclusivamente APRS-IS ---\n        if mode == "aprsis_long_bulletin_test":\n            try:\n                resp = await send_aprsis_long_bulletin_test(\n                    obj.get("text", ""),\n                    obj.get("bulletin_number", 0),\n                )\n            except Exception as exc:\n                resp = {\n                    "ok": False, "sent": False, "reason": "internal_error",\n                    "error": f"{type(exc).__name__}: {exc}",\n                }\n                print(f"[APRS-IS LONG BLN TEST] ERROR {resp['error']}")\n            try:\n                sock.sendto(json.dumps(resp, ensure_ascii=False).encode("utf-8"), addr)\n            except Exception:\n                pass\n            continue\n\n'''
          text = text.replace(ctrl, block + ctrl, 1)
          path.write_text(text, encoding='utf-8', newline='\n')

          env = Path('.env_example')
          data = env.read_text(encoding='utf-8')
          anchor = 'APRSIS_LONG_TEST_MAX_CHARS=400\n'
          assert data.count(anchor) == 1
          data = data.replace(anchor, anchor + 'APRSIS_LONG_BULLETIN_TEST_ENABLED=0\n', 1)
          env.write_text(data, encoding='utf-8', newline='\n')

          readme = Path('README.md')
          data = readme.read_text(encoding='utf-8').replace('v7.0.46', 'v7.0.47', 1)
          readme.write_text(data, encoding='utf-8', newline='\n')

          panel = Path('tools/ControlPanel/web_admin.py')
          data = panel.read_text(encoding='utf-8').replace('UI 2 · v7.0.46', 'UI 2 · v7.0.47', 1)
          panel.write_text(data, encoding='utf-8', newline='\n')

          docs = Path('docs/APRS_GATEWAY.md')
          data = docs.read_text(encoding='utf-8')
          anchor = '## 14. NOGATE, RFONLY, bucles y duplicados\n'
          assert anchor in data
          section = '''### 13.2 Diagnóstico de boletín BLNx largo (v7.0.47)\n\nLa v7.0.47 añade una prueba manual distinta de `aprsis_long_test`: construye\nun verdadero boletín `BLNx` con más de 67 caracteres para comprobar qué\naceptan APRS-IS y aprs.fi dentro de la sección Boletines.\n\n```env\nAPRSIS_LONG_BULLETIN_TEST_ENABLED=0\n```\n\nEl modo UDP es `aprsis_long_bulletin_test`. Está desactivado por defecto,\nsolo usa APRS-IS y no modifica los boletines automáticos, sus slots,\ndeduplicación, MIN_INTERVAL ni APRS RF.\n\n'''
          if '### 13.2 Diagnóstico de boletín BLNx largo (v7.0.47)' not in data:
              data = data.replace(anchor, section + anchor, 1)
          docs.write_text(data, encoding='utf-8', newline='\n')
          PY

      - name: Add regression tests
        shell: bash
        run: |
          cat > tests/test_aprsis_long_bulletin_v7047.py <<'PY'
          import asyncio
          import importlib.util
          import os
          from pathlib import Path

          ROOT = Path(__file__).resolve().parents[1]
          MODULE_PATH = ROOT / 'source' / 'meshtastic_to_aprs.py'

          def load_gateway():
              os.environ.setdefault('APRSIS_USER', 'EB2EAS-11')
              spec = importlib.util.spec_from_file_location('gateway_v7047', MODULE_PATH)
              module = importlib.util.module_from_spec(spec)
              spec.loader.exec_module(module)
              return module

          def test_long_bulletin_is_disabled_by_default():
              m = load_gateway()
              m.APRSIS_LONG_BULLETIN_TEST_ENABLED = 0
              result = asyncio.run(m.send_aprsis_long_bulletin_test('PRUEBA ' * 20, 0))
              assert result['sent'] is False
              assert result['reason'] == 'disabled'

          def test_long_bulletin_builds_real_bln_without_67_char_trim(monkeypatch):
              m = load_gateway()
              m.APRSIS_LONG_BULLETIN_TEST_ENABLED = 1
              m.APRSIS_LONG_TEST_MAX_CHARS = 400
              m.APRSIS_EMERGENCY_BULLETIN_GROUP = ''
              monkeypatch.setattr(m, '_aprsis_ready', lambda: True)
              captured = []
              async def fake_send(line):
                  captured.append(line)
                  return True
              monkeypatch.setattr(m, '_aprsis_send_line_safe', fake_send)
              text = ('PRUEBA BLN LARGO CORTE DE TRAFICO CV-128 km 21.5 CATI '
                      'URL https://maps.google.com/?q=40.47123,0.02234 '
                      'FIN-PRUEBA-BLN-LARGO')
              assert len(text) > 67
              result = asyncio.run(m.send_aprsis_long_bulletin_test(text, 0))
              assert result['sent'] is True
              assert result['bulletin'] == 'BLN0'
              assert result['chars'] == len(text)
              assert len(result['text']) > 67
              assert captured == [result['line']]
              assert '::BLN0     :' in result['line']
              assert text in result['line']
              assert result['line'].endswith('FIN-PRUEBA-BLN-LARGO')
              assert 'https://maps.google.com/?q=40.47123,0.02234' in result['line']

          def test_long_bulletin_respects_configured_group(monkeypatch):
              m = load_gateway()
              m.APRSIS_LONG_BULLETIN_TEST_ENABLED = 1
              m.APRSIS_EMERGENCY_BULLETIN_GROUP = 'EMERG'
              monkeypatch.setattr(m, '_aprsis_ready', lambda: True)
              async def fake_send(line): return True
              monkeypatch.setattr(m, '_aprsis_send_line_safe', fake_send)
              result = asyncio.run(m.send_aprsis_long_bulletin_test('PRUEBA GRUPO', 3))
              assert result['bulletin'] == 'BLN3EMERG'
              assert '::BLN3EMERG:' in result['line']
          PY

      - name: Validate
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile source/meshtastic_to_aprs.py tools/ControlPanel/web_admin.py
          python3 -m pip install -q pytest
          python3 -m pytest \
            tests/test_aprsis_long_bulletin_v7047.py \
            tests/test_aprsis_url_integrity_v7046.py \
            tests/test_aprsis_emergency_bulletin.py \
            tests/test_emergency_dispatcher.py -v
          git diff --check

      - name: Commit validated phase
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add source/meshtastic_to_aprs.py .env_example README.md tools/ControlPanel/web_admin.py docs/APRS_GATEWAY.md tests/test_aprsis_long_bulletin_v7047.py
          git commit -m 'v7.0.47: add isolated long BLNx APRS-IS diagnostic'
          git push origin HEAD:agent/aprsis-bulletin-groups
