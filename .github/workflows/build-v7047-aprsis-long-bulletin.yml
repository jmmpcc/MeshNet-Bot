name: Validate v7.0.47 long BLNx diagnostic
on:
  push:
    branches: [agent/aprsis-bulletin-groups]
    paths: [.github/workflows/build-v7047-aprsis-long-bulletin.yml]
permissions:
  contents: write
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/aprsis-bulletin-groups
          fetch-depth: 0
      - name: Apply phase
        run: python3 scripts/integrate_v7047_temp.py
      - name: Validate
        run: |
          python3 -m py_compile source/meshtastic_to_aprs.py tools/ControlPanel/web_admin.py
          python3 -m pip install -q pytest
          python3 -m pytest tests/test_aprsis_long_bulletin_v7047.py tests/test_aprsis_url_integrity_v7046.py tests/test_aprsis_emergency_bulletin.py tests/test_emergency_dispatcher.py -v
          git diff --check
      - name: Commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add source/meshtastic_to_aprs.py .env_example README.md tools/ControlPanel/web_admin.py tests/test_aprsis_long_bulletin_v7047.py
          git commit -m 'v7.0.47: add isolated long BLNx APRS-IS diagnostic'
          git push origin HEAD:agent/aprsis-bulletin-groups
