name: Revert MeshCore contactos PR166

on:
  push:
    branches:
      - revert/mc-contactos-166

permissions:
  contents: write

jobs:
  revert-and-validate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: revert/mc-contactos-166
          fetch-depth: 0

      - name: Revert PR 166 merge exactly
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git revert -m 1 --no-edit a4269f0855d4b928927b7fc375b2f5445dee5d30

      - name: Validate restored broker
        shell: bash
        run: |
          python -m py_compile source/Meshtastic_Broker.py source/Telegram_Bot_Broker.py
          python - <<'PY'
          from pathlib import Path
          s = Path('source/Meshtastic_Broker.py').read_text(encoding='utf-8')
          assert 'observed_prefix = self._meshcore_contact_prefix_by_name(name)' not in s
          assert 'if pref and alias and pref not in self.contact_aliases:' not in s
          assert 'dm_key = display_id or (public_key[:12] if public_key else "") or contact_id' in s
          print('PR166 exact revert checks: OK')
          PY
          git diff HEAD^ --check

      - name: Remove temporary workflow and push
        shell: bash
        run: |
          rm .github/workflows/revert-mc-contactos-166.yml
          git add .github/workflows/revert-mc-contactos-166.yml
          git commit -m "chore: remove temporary revert workflow"
          git push origin HEAD:revert/mc-contactos-166
