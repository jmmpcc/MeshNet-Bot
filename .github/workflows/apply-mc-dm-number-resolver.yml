name: Apply isolated MeshCore DM number resolver

on:
  push:
    branches: ["fix/mc-dm-number-resolver"]

permissions:
  contents: write

jobs:
  apply-and-validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply isolated resolver
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          broker_path = Path('source/Meshtastic_Broker.py')
          bot_path = Path('source/Telegram_Bot_Broker.py')
          broker = broker_path.read_text(encoding='utf-8')
          bot = bot_path.read_text(encoding='utf-8')

          old = '''        self._mc_contacts_cache: dict[str, dict] = {}\n        self._mc_path_prefix_cache: dict[str, list[dict]] = {}\n'''
          new = '''        self._mc_contacts_cache: dict[str, dict] = {}\n        self._mc_path_prefix_cache: dict[str, list[dict]] = {}\n\n        # Prefijos DM observados realmente en RX, separados del catálogo de contactos.\n        # Clave: alias normalizado; valor: conjunto de prefixes RF vistos para ese alias.\n        # Este mapa NO interviene en list_contacts() ni modifica MESHCORE_CONTACT_ALIASES.\n        self._mc_observed_dm_prefixes_by_alias: dict[str, set[str]] = {}\n'''
          assert old in broker, 'anchor broker cache not found'
          broker = broker.replace(old, new, 1)

          anchor = '''        unique = list(dict.fromkeys(matches))\n        return unique[0] if len(unique) == 1 else ""\n\n    def _meshcore_contact_display(self, contact: dict | None, fallback: str = "") -> str:\n'''
          replacement = '''        unique = list(dict.fromkeys(matches))\n        return unique[0] if len(unique) == 1 else ""\n\n    def _meshcore_remember_observed_dm_prefix(self, alias: str, prefix: str) -> None:\n        """Guarda un prefix DM recibido realmente por RF para un alias.\n\n        Se llama desde el manejador RX después de obtener alias y ``pubkey_prefix``\n        directamente del evento MeshCore. No deriva el valor desde ``public_key`` y\n        no altera ``contact_aliases`` ni las estructuras usadas por ``list_contacts``.\n\n        Parámetros:\n            alias: nombre/alias anunciado o extraído del mensaje RX.\n            prefix: ``pubkey_prefix`` recibido literalmente en el evento RF.\n        """\n        wanted = _norm_text(alias or "").casefold()\n        clean_prefix = str(prefix or "").strip().lower()\n        if not wanted or not re.fullmatch(r"[0-9a-f]{6,64}", clean_prefix):\n            return\n        bucket = self._mc_observed_dm_prefixes_by_alias.setdefault(wanted, set())\n        bucket.add(clean_prefix)\n\n    def resolve_observed_dm_prefix(self, alias: str) -> str:\n        """Devuelve un único prefix DM autoritativo para un alias, si existe.\n\n        Prioridad:\n            1. Prefix observado realmente en RX para el alias.\n            2. ``MESHCORE_CONTACT_ALIASES`` ya configurado, si es inequívoco.\n\n        No consulta ``public_key[:12]`` ni el catálogo de ``list_contacts`` para\n        evitar repetir la asociación incorrecta que motivó esta corrección. Si\n        existen varios prefixes para el mismo alias devuelve cadena vacía.\n        """\n        wanted = _norm_text(alias or "").casefold()\n        if not wanted:\n            return ""\n\n        observed = sorted(self._mc_observed_dm_prefixes_by_alias.get(wanted, set()))\n        if len(observed) == 1:\n            return observed[0]\n        if len(observed) > 1:\n            return ""\n\n        configured = []\n        for key, value in (self.contact_aliases or {}).items():\n            if _norm_text(value).casefold() == wanted and str(key).strip():\n                configured.append(str(key).strip().lower())\n        unique = list(dict.fromkeys(configured))\n        return unique[0] if len(unique) == 1 else ""\n\n    def _meshcore_contact_display(self, contact: dict | None, fallback: str = "") -> str:\n'''
          assert anchor in broker, 'anchor broker resolver not found'
          broker = broker.replace(anchor, replacement, 1)

          anchor = '''                except Exception:\n                    pass\n\n                # === [BBS] Comandos recibidos directamente por MeshCore ======\n'''
          replacement = '''                except Exception:\n                    pass\n\n                # Conserva de forma aislada el prefix DM visto realmente en RF.\n                # Se usa data["pubkey_prefix"] y no ``pref`` porque este último puede\n                # haber sido derivado como fallback cuando el evento no trae prefix.\n                self._meshcore_remember_observed_dm_prefix(\n                    alias, str(data.get("pubkey_prefix") or "").strip()\n                )\n\n                # === [BBS] Comandos recibidos directamente por MeshCore ======\n'''
          assert anchor in broker, 'anchor broker RX not found'
          broker = broker.replace(anchor, replacement, 1)

          anchor = '''            # --- NUEVO: enviar a MeshCore (canal_idx) desde clientes (BOT) ---\n            # --- NUEVO: enviar a MeshCore desde clientes (BOT) ---\n            elif cmd == "MESHCORE_SEND":\n'''
          replacement = '''            # Resolución de solo lectura: alias -> prefix DM observado/configurado.\n            # No modifica contactos, colas ni estado de transmisión.\n            elif cmd == "MESHCORE_RESOLVE_CONTACT":\n                try:\n                    params = req.get("params") or {}\n                    alias = str(params.get("alias") or "").strip()\n                    eng = globals().get("MESHCORE_ENGINE")\n                    if not alias:\n                        resp = {"ok": False, "error": "missing alias"}\n                    elif not eng or not hasattr(eng, "resolve_observed_dm_prefix"):\n                        resp = {"ok": False, "error": "meshcore_resolver_unavailable"}\n                    else:\n                        resolved_prefix = eng.resolve_observed_dm_prefix(alias)\n                        resp = {\n                            "ok": True,\n                            "resolved": bool(resolved_prefix),\n                            "contact_prefix": resolved_prefix or None,\n                        }\n                except Exception as e:\n                    resp = {"ok": False, "error": f"meshcore_resolve_failed: {type(e).__name__}: {e}"}\n                conn.sendall((json.dumps(resp, ensure_ascii=False) + "\\n").encode("utf-8"))\n                return\n\n            # --- NUEVO: enviar a MeshCore (canal_idx) desde clientes (BOT) ---\n            # --- NUEVO: enviar a MeshCore desde clientes (BOT) ---\n            elif cmd == "MESHCORE_SEND":\n'''
          assert anchor in broker, 'anchor broker control not found'
          broker = broker.replace(anchor, replacement, 1)

          anchor = '''def _send_via_broker_queue(text: str, ch: int, dest: str | None = None, ack: bool = False, timeout: float = 3.0) -> dict:\n'''
          helper = '''def _resolve_meshcore_contact_alias_via_ctrl(alias: str, timeout: float = 2.0) -> str | None:\n    """Resuelve un alias al prefix DM observado por el broker sin alterar contactos.\n\n    Uso:\n        prefix = _resolve_meshcore_contact_alias_via_ctrl("EB2EAS T1000e")\n\n    Parámetros:\n        alias: alias visible guardado por ``/mc_contactos`` para el número elegido.\n        timeout: tiempo máximo de la consulta al BacklogServer/control del broker.\n\n    Funcionalidad:\n        - Consulta ``MESHCORE_RESOLVE_CONTACT`` de forma síncrona.\n        - Acepta únicamente un prefix hexadecimal válido.\n        - Si el broker no soporta el comando, no conoce el alias o hay ambigüedad,\n          devuelve ``None`` para que el envío conserve el ``dm_key`` existente.\n        - No modifica ``/mc_contactos``, ``list_contacts`` ni la ruta TX manual.\n    """\n    clean_alias = str(alias or "").strip()\n    if not clean_alias:\n        return None\n\n    payload = {"cmd": "MESHCORE_RESOLVE_CONTACT", "params": {"alias": clean_alias}}\n    data = (json.dumps(payload, ensure_ascii=False) + "\\n").encode("utf-8")\n    try:\n        with socket.create_connection(\n            (BROKER_CTRL_HOST or "127.0.0.1", int(BROKER_CTRL_PORT)),\n            timeout=float(timeout),\n        ) as s:\n            s.sendall(data)\n            s.settimeout(float(timeout))\n            buf = b""\n            while True:\n                chunk = s.recv(65536)\n                if not chunk:\n                    break\n                buf += chunk\n                if b"\\n" in chunk:\n                    break\n        raw = buf.decode("utf-8", "ignore").strip()\n        if not raw:\n            return None\n        response = json.loads(raw)\n    except Exception:\n        return None\n\n    if not isinstance(response, dict) or not response.get("ok") or not response.get("resolved"):\n        return None\n    return _extract_mc_contact_prefix_from_text(str(response.get("contact_prefix") or ""))\n\n\n'''
          assert anchor in bot, 'anchor telegram helper not found'
          bot = bot.replace(anchor, helper + anchor, 1)

          old = '''            try:\n                cp = (context.user_data.get("mc_contacts_map") or {}).get(idx_s)\n                contact_alias = (context.user_data.get("mc_contacts_alias_map") or {}).get(idx_s)\n            except Exception:\n                cp = None\n                contact_alias = None\n'''
          new = '''            try:\n                cp = (context.user_data.get("mc_contacts_map") or {}).get(idx_s)\n                contact_alias = (context.user_data.get("mc_contacts_alias_map") or {}).get(idx_s)\n            except Exception:\n                cp = None\n                contact_alias = None\n\n            # El número conserva el mapa existente. Solo si el broker conoce un\n            # prefix RF inequívoco para su alias, se sustituye el dm_key fallback.\n            # El uso manual de un prefix nunca pasa por este resolvedor.\n            if contact_alias:\n                resolved_prefix = await asyncio.to_thread(\n                    _resolve_meshcore_contact_alias_via_ctrl, contact_alias, 2.0\n                )\n                if resolved_prefix:\n                    cp = resolved_prefix\n'''
          assert old in bot, 'anchor telegram numeric resolution not found'
          bot = bot.replace(old, new, 1)

          broker_path.write_text(broker, encoding='utf-8')
          bot_path.write_text(bot, encoding='utf-8')
          PY

      - name: Add regression test
        shell: bash
        run: |
          cat > tests/test_mc_dm_number_observed_prefix.py <<'PY'
          from __future__ import annotations

          import ast
          from pathlib import Path

          BROKER = Path('source/Meshtastic_Broker.py')
          BOT = Path('source/Telegram_Bot_Broker.py')

          def function_source(path: Path, name: str) -> str:
              source = path.read_text(encoding='utf-8')
              tree = ast.parse(source)
              for node in ast.walk(tree):
                  if isinstance(node, (ast.FunctionDef, ast.AsyncFunctionDef)) and node.name == name:
                      segment = ast.get_source_segment(source, node)
                      assert segment is not None
                      return segment
              raise AssertionError(f'{name} not found')

          def test_mc_contactos_remains_untouched_by_new_resolver() -> None:
              fn = function_source(BOT, 'mc_contactos_cmd')
              assert 'mc_map[str(idx)] = dm_key' in fn
              assert 'MESHCORE_RESOLVE_CONTACT' not in fn
              assert '_resolve_meshcore_contact_alias_via_ctrl' not in fn

          def test_broker_list_contacts_does_not_use_observed_prefix_map() -> None:
              fn = function_source(BROKER, 'list_contacts')
              assert '_mc_observed_dm_prefixes_by_alias' not in fn
              assert 'resolve_observed_dm_prefix' not in fn

          def test_rx_learns_only_literal_event_prefix() -> None:
              source = BROKER.read_text(encoding='utf-8')
              assert 'self._meshcore_remember_observed_dm_prefix(' in source
              assert 'alias, str(data.get("pubkey_prefix") or "").strip()' in source
              assert 'self.contact_aliases[pref] = alias' not in source

          def test_resolver_avoids_public_key_fallback() -> None:
              fn = function_source(BROKER, 'resolve_observed_dm_prefix')
              assert '_mc_observed_dm_prefixes_by_alias' in fn
              assert 'self.contact_aliases' in fn
              assert 'public_key[:12]' not in fn
              assert '_mc_contacts_cache' not in fn

          def test_numeric_dm_resolves_alias_but_manual_prefix_does_not() -> None:
              fn = function_source(BOT, 'enviar_mc_dm_cmd')
              assert 'if not cp and str(text_tokens[0]).isdigit()' in fn
              assert '_resolve_meshcore_contact_alias_via_ctrl, contact_alias, 2.0' in fn
              assert 'if resolved_prefix:' in fn
              assert 'cp = resolved_prefix' in fn
              assert '_extract_mc_contact_prefix_from_text(text_tokens[0])' in fn

          def test_control_endpoint_is_read_only_and_separate_from_send() -> None:
              source = BROKER.read_text(encoding='utf-8')
              assert 'elif cmd == "MESHCORE_RESOLVE_CONTACT"' in source
              assert 'resolved_prefix = eng.resolve_observed_dm_prefix(alias)' in source
              assert 'elif cmd == "MESHCORE_SEND"' in source

          def test_sources_parse() -> None:
              ast.parse(BROKER.read_text(encoding='utf-8'))
              ast.parse(BOT.read_text(encoding='utf-8'))
          PY

      - name: Validate
        shell: bash
        run: |
          python -m py_compile source/Meshtastic_Broker.py source/Telegram_Bot_Broker.py
          python -m pytest -q tests/test_mc_dm_number_observed_prefix.py tests/test_mc_contactos_full_public_key.py tests/test_mc_dm_alias_confirmation.py
          git diff --check

      - name: Commit implementation and remove temporary workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add source/Meshtastic_Broker.py source/Telegram_Bot_Broker.py tests/test_mc_dm_number_observed_prefix.py
          git commit -m "fix: resolve MeshCore DM number using observed RF prefix"
          git rm .github/workflows/apply-mc-dm-number-resolver.yml
          git commit -m "chore: remove temporary DM resolver workflow"
          git push origin HEAD:fix/mc-dm-number-resolver
