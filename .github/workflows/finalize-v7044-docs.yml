name: Finalize v7.0.44 documentation

on:
  push:
    branches:
      - agent/v7.0.44-aprsis-push-help

permissions:
  contents: write

jobs:
  finalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Update version and APRS-IS documentation
        run: |
          python - <<'PY'
          from pathlib import Path

          root = Path('README.md')
          text = root.read_text(encoding='utf-8')
          text = text.replace('MeshNet-Bot “The Boss” — v7.0.43', 'MeshNet-Bot “The Boss” — v7.0.44', 1)
          root.write_text(text, encoding='utf-8')

          bot = Path('docs/BOT_README.md')
          text = bot.read_text(encoding='utf-8')
          text = text.replace('# Bot Telegram de MeshNet-Bot — guía v7.0.36', '# Bot Telegram de MeshNet-Bot — guía v7.0.44', 1)
          old = '''/aprsis_push on all
          /aprsis_push on 1
          /aprsis_push on meshtastic 0,1 meshcore 2
          /aprsis_push off'''
          new = '''/aprsis_push status
          /aprsis_push on all
          /aprsis_push on 0,1
          /aprsis_push on meshtastic 0,1
          /aprsis_push on meshcore 2,3
          /aprsis_push on meshtastic 0,1 meshcore 2
          /aprsis_push off'''
          if old not in text:
              raise SystemExit('No se encontró el bloque APRS-IS esperado en BOT_README.md')
          text = text.replace(old, new, 1)
          marker = 'El destino APRS-IS se configura con `APRSIS_PUSH_TO`.'
          note = '''La sintaxis sin prefijo (`all`, `0,1`) es la compatibilidad histórica de Meshtastic. Para MeshCore se usa `meshcore` o el alias `mc`; `mesh`/`malla` son alias de Meshtastic. En `RADIO_PROFILE=meshcore_only` es obligatorio indicar explícitamente `meshcore` o `mc`. Los canales admitidos por el parser son `0..15`.

'''
          if note not in text:
              text = text.replace(marker, note + marker, 1)
          bot.write_text(text, encoding='utf-8')
          PY

      - name: Validate bot and focused tests
        run: |
          python -m py_compile source/Telegram_Bot_Broker.py
          python -m pytest tests/test_aprsis_push_bot_help.py -v
          git diff --check

      - name: Commit documentation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md docs/BOT_README.md
          git commit -m "v7.0.44: update bot APRS-IS documentation"
          git push
