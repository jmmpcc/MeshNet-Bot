services:
  broker:
    image: ghcr.io/jmmpcc/meshnet-bot-broker:latest
    container_name: meshnet-broker
    restart: unless-stopped
    sysctls:
      net.ipv4.tcp_keepalive_time: 30
      net.ipv4.tcp_keepalive_intvl: 10
      net.ipv4.tcp_keepalive_probes: 3
    environment:
      - BROKER_CTRL_BIND=0.0.0.0

    # Permite que el broker acceda de forma estable a servicios que se ejecutan
    # directamente en la Raspberry, como la API independiente de farmacias.
    # Dentro del contenedor, host.docker.internal resolverá al host Docker.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    devices:
      - "/dev/ttyACM0:/dev/ttyACM0"
    privileged: true
 
    env_file:
      - .env

    entrypoint: ["/usr/local/bin/entrypoint_broker.sh"]

    # Puertos expuestos hacia la red local de la Raspberry
    ports:
      - "${BROKER_PORT_HOST:-8765}:${BROKER_PORT:-8765}"
      - "${BACKLOG_PORT_HOST:-8766}:${BACKLOG_PORT:-8766}"
      - "${WEB_PORT_HOST:-8080}:${WEB_PORT:-8080}"
      # Control UDP APRS accesible únicamente desde el propio host.
      # El servicio aprs comparte el namespace de red del broker.
      - "127.0.0.1:${APRS_CTRL_PORT_HOST:-9464}:${APRS_CTRL_PORT:-9464}/udp"

    # Datos persistentes de bot/broker (backlogs, mapas, auditorías, etc.)
    volumes:
      - ./bot_data:/app/bot_data:rw
     
    stop_grace_period: 15s


  bot:
    image: ghcr.io/jmmpcc/meshnet-bot-bot:latest
    container_name: meshnet-bot

    depends_on:
      - broker

    restart: on-failure

    env_file:
      - .env

    entrypoint: ["/usr/local/bin/entrypoint_bot.sh"]

    # Comparte red con el broker: BROKER_HOST=127.0.0.1 del .env sigue siendo válido
    network_mode: "service:broker"

    volumes:
      - ./bot_data:/app/bot_data:rw
      
    stop_grace_period: 10s


  aprs:
    image: ghcr.io/jmmpcc/meshnet-bot-aprs:latest
    container_name: meshnet-aprs

    depends_on:
      - broker

    restart: unless-stopped

    env_file:
      - .env

    entrypoint: ["/usr/local/bin/entrypoint_aprs.sh"]

    # Comparte red con el broker; APRS_CTRL_HOST=127.0.0.1 y BROKER_HOST=127.0.0.1 tienen sentido
    network_mode: "service:broker"

    volumes:
      - ./bot_data:/app/bot_data:rw
      # Monta el gateway entregado con esta versión sobre el contenido de la
      # imagen GHCR. Así los cambios locales de APRS_CTRL_BIND y boletines se
      # aplican al recrear el contenedor sin depender de que :latest se haya
      # reconstruido y publicado previamente.
      - ./source/meshtastic_to_aprs.py:/app/source/meshtastic_to_aprs.py:ro

    stop_grace_period: 10s
 
  bridgehub-bc:
    image: ghcr.io/jmmpcc/meshnet-bot-bridge-bc:latest
    container_name: meshnet-bridge-bc
    restart: unless-stopped
    env_file:
      - .env-triple-bridge
    depends_on:
      - broker 
    volumes:
      - ./bot_data:/app/bot_data:rw
    environment:
      BROKER_CTRL_HOST: "meshnet-broker"
      BROKER_CTRL_PORT: "8766"

  email-to-mesh:
    image: ghcr.io/jmmpcc/meshnet-bot-broker:latest
    container_name: meshnet-email-to-mesh

    depends_on:
      - broker

    restart: unless-stopped

    env_file:
      - .env

    entrypoint:
      - python
      - -u
      - /app/source/email_to_mesh.py

    # Comparte la red del broker. Así BROKER_CTRL_HOST=127.0.0.1
    # y BROKER_CTRL_PORT=8766 siguen siendo válidos sin exponer otro puerto.
    network_mode: "service:broker"

    volumes:
      - ./bot_data:/app/bot_data:rw

    stop_grace_period: 10s

